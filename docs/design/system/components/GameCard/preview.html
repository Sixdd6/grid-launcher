<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Game card</title>
<style>
  body { padding: 16px; background: var(--bg); }
  .row { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; }
  .col { display: flex; flex-direction: column; gap: 10px; }
  .cap { font-size: 11px; color: var(--text-muted); margin: 0 0 6px; }

  .g-art::before { content:''; position:absolute; right:-18%; top:12%; width:70%; aspect-ratio:1; border-radius:50%; background:rgba(255,255,255,.12); }
  .g-art::after { content:''; position:absolute; left:10%; top:8%; width:34%; height:6px; border-radius:3px; background:rgba(255,255,255,.35); }
  .g-art { padding-bottom: 34px; }
  .g-art span { position:relative; text-shadow:0 1px 2px rgba(0,0,0,.35); }

  .cards { display:grid; grid-template-columns:repeat(4,160px); gap:16px 14px; padding-bottom:24px; }
</style></head>
<body>
<p class="cap">Hover a card: it lifts, the action bar shows, and the full title wraps. Covers are placeholders.</p><div class="cards"><div class="g-card">
  <div class="g-cover"><div class="g-art" style="background:hsl(258 45% 38%)"><span>Starfall Circuit</span></div><span class="g-dot" role="img" aria-label="Installed"></span><span class="g-cloud-badge g-corner" role="img" aria-label="Cloud saves enabled" data-icon="cloud" data-size="14"></span>
    <div class="g-shade" aria-hidden="true"></div>
    <div class="g-bar"><button class="g-card-primary">Play</button><button class="g-round" aria-label="Cloud sync" data-icon="cloud" data-size="15"></button><button class="g-round" aria-label="Details" data-icon="more" data-size="15"></button></div>
  </div><span class="g-label" title="Starfall Circuit">Starfall Circuit</span>
</div><div class="g-card">
  <div class="g-cover"><div class="g-art" style="background:hsl(32 70% 42%)"><span>Lantern Vale</span></div><div class="g-tag-stack"><span class="g-tag update">UPDATE</span></div><span class="g-dot" role="img" aria-label="Installed"></span>
    <div class="g-shade" aria-hidden="true"></div>
    <div class="g-bar"><button class="g-card-primary">Play</button><button class="g-round" aria-label="Cloud sync" data-icon="cloud" data-size="15"></button><button class="g-round" aria-label="Details" data-icon="more" data-size="15"></button></div>
  </div><span class="g-label" title="Lantern Vale">Lantern Vale</span>
</div><div class="g-card">
  <div class="g-cover"><div class="g-art" style="background:hsl(205 55% 34%)"><span>Ironclad Drift</span></div><div class="g-tag-stack"><span class="g-tag missing">MISSING</span></div><span class="g-dot" role="img" aria-label="Installed"></span><span class="g-tag platform g-corner">SAT</span>
    <div class="g-shade" aria-hidden="true"></div>
    <div class="g-bar"><button class="g-card-primary">Details</button><button class="g-round" aria-label="Cloud sync" data-icon="cloud" data-size="15"></button><button class="g-round" aria-label="Details" data-icon="more" data-size="15"></button></div>
  </div><span class="g-label" title="Ironclad Drift">Ironclad Drift</span>
</div><div class="g-card focused">
  <div class="g-cover"><div class="g-art" style="background:hsl(140 35% 30%)"><span>Moss & Marrow</span></div>
    <div class="g-shade" aria-hidden="true"></div>
    <div class="g-bar"><button class="g-card-primary">Install</button><button class="g-round" aria-label="Cloud sync" data-icon="cloud" data-size="15"></button><button class="g-round" aria-label="Details" data-icon="more" data-size="15"></button></div>
  </div><span class="g-label" title="Moss & Marrow">Moss & Marrow</span>
</div></div>
<script>
(function(){
var I={"close": "M6 6l12 12M18 6L6 18", "chevronLeft": "M15.5 5L8.5 12l7 7", "check": "M5 12.5l5 5L19 7", "chevronRight": "M8.5 5l7 7-7 7", "arrowLeft": "M19.5 12H4.5M11 5.5L4.5 12l6.5 6.5", "cloud": "M6.2 17h10a4 4 0 0 0 0-8h-.6A5.2 5.2 0 0 0 6.4 10.6 3.3 3.3 0 0 0 6.2 17z", "star": "M12 4.4L13.88 9.81L19.61 9.93L15.04 13.39L16.7 18.87L12 15.6L7.3 18.87L8.96 13.39L4.39 9.93L10.12 9.81Z", "download": "M12 3.5V14M7.5 9.5L12 14L16.5 9.5M4.5 17v2a1.5 1.5 0 0 0 1.5 1.5h12a1.5 1.5 0 0 0 1.5-1.5v-2", "play": "M7.5 4.5L19 12L7.5 19.5Z", "more": "M7.6 12a1.6 1.6 0 1 1-3.2 0a1.6 1.6 0 1 1 3.2 0zM13.6 12a1.6 1.6 0 1 1-3.2 0a1.6 1.6 0 1 1 3.2 0zM19.6 12a1.6 1.6 0 1 1-3.2 0a1.6 1.6 0 1 1 3.2 0z", "grid": "M4 4h6v6H4zM14 4h6v6h-6zM4 14h6v6H4zM14 14h6v6h-6z", "sun": "M12 8a4 4 0 1 0 0 8a4 4 0 1 0 0-8zM12 2.75v2M12 19.25v2M2.75 12h2M19.25 12h2M5.46 5.46l1.41 1.41M17.13 17.13l1.41 1.41M5.46 18.54l1.41-1.41M17.13 6.87l1.41-1.41", "moon": "M19.5 14.6A7.6 7.6 0 0 1 9.4 4.5a7.6 7.6 0 1 0 10.1 10.1z", "drive": "M3.5 14h17v4.5A1.5 1.5 0 0 1 19 20H5a1.5 1.5 0 0 1-1.5-1.5zM3.5 14l2.6-8.2A1.5 1.5 0 0 1 7.5 4.7h9a1.5 1.5 0 0 1 1.4 1.1L20.5 14M16.5 17h.01M13.5 17h.01"}, F=['star','play','more'];
window.gIcon=function(n,s){s=s||14;var f=F.indexOf(n)>=0;
return '<svg class="g-icon" viewBox="0 0 24 24" width="'+s+'" height="'+s+'" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="'+I[n]+'" fill="'+(f?'currentColor':'none')+'" stroke="'+(f?'none':'currentColor')+'"/></svg>';};
window.gIcons=function(root){(root||document).querySelectorAll('[data-icon]').forEach(function(el){el.innerHTML=gIcon(el.getAttribute('data-icon'),+el.getAttribute('data-size')||14);});};
gIcons();
})();
</script>

</body>
</html>
