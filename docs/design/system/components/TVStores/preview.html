<!-- @dsCard group="Prototype" height=800 width=1280 subtitle="TV mode with game stores: GOG, Epic Games, Amazon Games and Steam in the Library and Settings › Stores. Arrows, Enter = A, Esc = B, X, Y, Q/E = LB/RB, Z = LT, M = Menu, V = View; a real controller works too" -->
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>TV mode: game stores</title>
<style>
/* ==== TV mode: a fullscreen, controller-first shell. Every size is in rem, and
   the root font is 1/54 of the screen height, so the layout is the same at 720p,
   1080p and 4K (20px at 1080p). ==== */
html { font-size: min(calc(100vh / 54), calc(100vw / 80)); }
html, body { height: 100%; overflow: hidden; margin: 0; }
body { padding: 0; background: var(--bg); color: var(--text); font-family: var(--font-sans, 'Segoe UI', system-ui, sans-serif); font-size: 1rem; line-height: 1.4; }
* { box-sizing: border-box; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; text-align: left; }
.tv { position: relative; height: 100vh; display: flex; flex-direction: column; overflow: clip; isolation: isolate; }
.tv-art { position: absolute; inset: -6rem; z-index: -1; filter: blur(3rem); transition: opacity 360ms ease; pointer-events: none; }
.tv-art i { position: absolute; border-radius: 50%; transition: background 600ms ease; }
.tv-art::after { content: ''; position: absolute; inset: 0; background: var(--bg); opacity: var(--fade, .45); }
.muted { color: var(--text-muted); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

/* ---- Focus: one ring everywhere, larger than the desktop's, and a lift for covers. */
[data-f] { outline: none; transition: transform 150ms ease, box-shadow 150ms ease, background 150ms ease; }
[data-f].f { outline: .2rem solid var(--focus); outline-offset: .2rem; }
[data-f][disabled], [data-f].off { opacity: .45; }

/* ---- Top bar */
.top { flex: 0 0 4.6rem; display: flex; align-items: center; gap: 1.4rem; padding: 0 2.4rem; background: var(--panel); border-bottom: 1px solid var(--line); }
.brand { display: flex; align-items: center; gap: .6rem; font-weight: 600; letter-spacing: .08em; font-size: 1.15rem; color: var(--text-h); }
.brand .g-icon { color: var(--primary); }
.brand small { font-size: .7rem; letter-spacing: .12em; font-weight: 600; color: var(--text-muted); border: 1px solid var(--line-strong); border-radius: 100px; padding: .05rem .5rem; }
.tabs { flex: 1; display: flex; justify-content: center; align-items: center; gap: .5rem; }
.tab { padding: .45rem 1.2rem; border-radius: 100px; font-weight: 600; color: var(--text-muted); font-size: 1.05rem; }
.tab.on { background: var(--primary); color: var(--on-primary); }
.crumb { flex: 1; display: flex; align-items: center; gap: .8rem; font-size: 1.1rem; color: var(--text-muted); }
.crumb b { color: var(--text-h); font-weight: 600; }
.status { display: flex; align-items: center; gap: 1.2rem; font-size: .95rem; color: var(--text-muted); }
.status .dot { width: .6rem; height: .6rem; border-radius: 50%; background: var(--success); display: inline-block; margin-right: .4rem; }
.status .dot.offline { background: var(--danger); }
.status .clock { color: var(--text-h); font-weight: 600; font-variant-numeric: tabular-nums; }
.status .dlmini { display: flex; align-items: center; gap: .4rem; }
.status .dlmini i { width: 4rem; height: .3rem; border-radius: .2rem; background: var(--field); overflow: hidden; display: inline-block; }
.status .dlmini i b { display: block; height: 100%; background: var(--primary); }

/* ---- Button glyphs: monochrome discs that follow the controller's family. */
.gl { display: inline-flex; align-items: center; justify-content: center; min-width: 1.7rem; height: 1.7rem; padding: 0 .35rem; border-radius: 100px; background: var(--text-h); color: var(--bg); font-size: .85rem; font-weight: 700; line-height: 1; letter-spacing: 0; }
.gl.round { width: 1.7rem; padding: 0; }
.gl.sh { font-size: 1rem; }
/* Kenney glyphs: white artwork used as a mask, filled with the text colour so it
   reads in both themes. */
.gli { display: inline-block; flex: 0 0 auto; width: 2.1rem; height: 2.1rem; vertical-align: middle; background: var(--text-h); -webkit-mask: var(--g) center / contain no-repeat; mask: var(--g) center / contain no-repeat; }
.key .gli { width: 1.6rem; height: 1.6rem; background: currentColor; }
.chip .gli, .toast .gli, .selbar .gli { width: 1.8rem; height: 1.8rem; }
.viewer .gli { background: #fff; }
.btn.pri .gli { background: var(--on-primary); }

/* ---- Stage and hint bar */
.stage { flex: 1 1 auto; min-height: 0; position: relative; overflow: hidden; }
.hints { position: relative; z-index: 35; flex: 0 0 3.6rem; display: flex; align-items: center; gap: 1.8rem; padding: 0 2.4rem; background: var(--panel); border-top: 1px solid var(--line); font-size: 1rem; }
.hints .left { flex: 1; color: var(--text-muted); display: flex; gap: 1rem; align-items: center; }
.hint { display: inline-flex; align-items: center; gap: .55rem; color: var(--text-h); font-weight: 600; }
.offline-pill { color: var(--on-danger); background: var(--danger); border-radius: 100px; padding: .1rem .7rem; font-weight: 600; font-size: .85rem; }

/* ---- Covers */
.cv { position: relative; flex: 0 0 auto; display: flex; flex-direction: column; gap: .5rem; width: var(--cw, 11rem); border-radius: .7rem; }
.cv[data-f].f { outline: none; }
.cv-art { position: relative; width: 100%; aspect-ratio: 3 / 4; border-radius: .7rem; background: var(--c); overflow: hidden; display: flex; align-items: flex-end; padding: .9rem; color: #fff; font-weight: 700; font-size: 1.1rem; line-height: 1.15; box-shadow: var(--shadow-card); transition: transform 150ms ease, box-shadow 150ms ease; }
.cv-art::before { content: ''; position: absolute; right: -18%; top: 12%; width: 70%; aspect-ratio: 1; border-radius: 50%; background: rgba(255,255,255,.12); }
.cv-art::after { content: ''; position: absolute; left: 10%; top: 8%; width: 34%; height: .4rem; border-radius: .2rem; background: rgba(255,255,255,.35); }
.cv-art .ttl { position: relative; text-shadow: 0 1px 2px rgba(0,0,0,.4); padding-bottom: 2rem; }
.cv.f .cv-art { transform: scale(1.07); box-shadow: var(--shadow-lift), 0 0 0 .22rem var(--bg), 0 0 0 .42rem var(--focus); }
.cv-l { font-size: .9rem; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding: 0 .1rem; }
.cv.f .cv-l { color: var(--text-h); font-weight: 600; }
.tag { position: absolute; z-index: 1; font-size: .7rem; font-weight: 700; letter-spacing: .06em; padding: .15rem .45rem; border-radius: .35rem; }
.tag.upd { top: .6rem; left: .6rem; background: var(--warning); color: #1a1a12; }
.tag.miss { top: .6rem; left: .6rem; background: #c62828; color: #fff; box-shadow: 0 0 0 1px #fff; }
.tag.plat { bottom: .6rem; left: .6rem; background: rgba(0,0,0,.7); color: #fff; }
.tag.q { bottom: .6rem; right: .6rem; background: rgba(0,0,0,.7); color: #fff; }
.idot { position: absolute; z-index: 1; top: .7rem; right: .7rem; width: .75rem; height: .75rem; border-radius: 50%; background: var(--success); box-shadow: 0 0 0 .15rem rgba(0,0,0,.5); }

/* ---- Home */
.home { position: absolute; inset: 0; display: flex; flex-direction: column; }
/* A fixed height, so the rows area never changes size as focus moves. */
.hero { flex: 0 0 15rem; height: 15rem; display: flex; align-items: flex-end; padding: 1.2rem 2.4rem .6rem; overflow: hidden; }
.hero-box { width: 46rem; max-width: 100%; padding: 1.4rem 1.8rem; border-radius: .9rem; background: var(--panel); border: 1px solid var(--line); }
.hero .plat { font-size: .8rem; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--text-muted); }
.logo { margin: .2rem 0 .4rem; font-size: 2.6rem; line-height: 1.1; font-weight: 800; letter-spacing: -.01em; color: var(--text-h); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hero .meta { color: var(--text-muted); font-size: 1rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hero .sum { margin: .6rem 0 0; font-size: 1rem; line-height: 1.4; height: 2.8em; color: var(--text); max-width: 40rem; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.rows { flex: 1 1 auto; min-height: 0; overflow-y: auto; padding: 0; scrollbar-width: none; }
.rows::-webkit-scrollbar, .track::-webkit-scrollbar, .scroll::-webkit-scrollbar { display: none; }
.shelf { padding-top: .6rem; }
.shelf h2 { margin: 0 2.4rem; line-height: 1.6rem; font-size: 1.25rem; font-weight: 600; color: var(--text-h); }
.shelf h2 span { color: var(--text-muted); font-weight: 400; font-size: 1rem; margin-left: .5rem; }
/* 1.4rem above and below: room for a focused cover's 7% growth and its ring,
   which the row's own edge would otherwise cut. */
.track { display: flex; gap: 1.3rem; overflow-x: auto; overflow-y: hidden; padding: 1.4rem 2.4rem 1.4rem; scrollbar-width: none; }
.track .cv { --cw: 10rem; }
.track .cv-l { display: none; }
.shelf .empty { margin: 0 2.4rem; }

/* ---- Rail + grid views (Library, Server, Settings) */
.split { position: absolute; inset: 0; display: flex; gap: 1.2rem; padding: 1.2rem 2.4rem 0; }
.rail { flex: 0 0 18rem; background: var(--panel); border: 1px solid var(--line); border-radius: 1rem; padding: .8rem; overflow-y: auto; scrollbar-width: none; display: flex; flex-direction: column; gap: .2rem; margin-bottom: 1.2rem; }
.rail h3 { margin: .8rem .9rem .3rem; font-size: .75rem; letter-spacing: .1em; color: var(--text-muted); font-weight: 600; }
.rail hr { border: 0; border-top: 1px solid var(--line); margin: .4rem .6rem; width: auto; }
.ri { display: flex; align-items: center; gap: .6rem; padding: .7rem .9rem; border-radius: .6rem; font-size: 1.05rem; color: var(--text); }
.ri .n { margin-left: auto; color: var(--text-muted); font-size: .9rem; }
.ri.sel { background: var(--selected); box-shadow: inset .25rem 0 0 var(--primary); color: var(--text-h); font-weight: 600; }
.ri.fold { color: var(--text-h); font-weight: 600; gap: .5rem; padding-left: .6rem; }
.ri.fold .chev { display: inline-flex; color: var(--text-muted); transition: transform 150ms ease; }
.ri.fold .chev.open { transform: rotate(90deg); }
.ri.fold .holds { color: var(--text-muted); font-weight: 400; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.ri.sub { padding-left: 2.3rem; }
.ri-empty { padding: .5rem .9rem .7rem 2.3rem; color: var(--text-muted); font-size: .95rem; }
.main { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; }
.vh { flex: 0 0 auto; display: flex; align-items: center; gap: 1rem; padding: .9rem 1.2rem; background: var(--panel); border: 1px solid var(--line); border-radius: 1rem; flex-wrap: wrap; }
.vh h1 { margin: 0; font-size: 1.6rem; font-weight: 600; color: var(--text-h); }
.vh .cnt { color: var(--text-muted); }
.vh .sp { flex: 1; }
.vh.two { flex-direction: column; align-items: stretch; flex-wrap: nowrap; gap: .7rem; }
.vh.two .vh-top { display: flex; align-items: baseline; gap: 1rem; min-width: 0; }
.vh.two .vh-row { display: flex; align-items: center; gap: 1rem; flex-wrap: wrap; }
.chip { display: inline-flex; align-items: center; gap: .4rem; padding: .35rem .9rem; border-radius: 100px; border: 1px solid var(--line-strong); font-size: .9rem; color: var(--text-muted); }
.chip b { color: var(--text-h); font-weight: 600; }
.chip.warn { border-color: var(--warning-text); color: var(--warning-text); }
/* The grid's scroll area reaches 1.2rem past the header on both sides, so covers
   still line up with the header while a grown, ringed cover in the first or last
   column has room. */
.scroll { flex: 1 1 auto; min-height: 0; overflow-y: auto; scrollbar-width: none; margin: 0 -1.2rem; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, 10rem); justify-content: space-between; gap: 1.6rem 1.2rem; padding: 1.4rem 1.2rem 2.4rem; }
.grid .cv { --cw: 10rem; }
.empty { color: var(--text-muted); font-size: 1.1rem; padding: 2rem .6rem; max-width: 40rem; }
.empty h2 { color: var(--text-h); margin: 0 0 .4rem; font-size: 1.4rem; }

/* ---- Buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: .55rem; min-height: 3rem; padding: 0 1.5rem; border-radius: 100px; font-weight: 600; font-size: 1.05rem; background: var(--surface); color: var(--text-h); border: 1px solid var(--line-strong); white-space: nowrap; }
.btn.pri { background: var(--primary); color: var(--on-primary); border-color: transparent; }
.btn.dng { color: var(--danger); border-color: var(--danger); }
.btn.f { transform: scale(1.04); }
.btn.pri.f { background: var(--primary-hover); }
.btns { display: flex; flex-wrap: wrap; gap: .9rem; }

/* ---- Details */
.det { position: absolute; inset: 0; display: grid; grid-template-columns: 17rem 1fr; grid-template-rows: minmax(0, 1fr); gap: 2.4rem; padding: 1.6rem 2.4rem 0; }
.det-l { display: flex; flex-direction: column; gap: 1rem; }
.det-l .cv { --cw: 17rem; }
.det-l .cv-l { display: none; }
.det-l .lp { font-size: .95rem; color: var(--text-muted); line-height: 1.5; }
.det-l .lp b { color: var(--text-h); font-weight: 600; }
.det-r { min-width: 0; min-height: 0; overflow: hidden; display: flex; flex-direction: column; background: var(--panel); border: 1px solid var(--line); border-radius: 1rem 1rem 0 0; padding: 1.6rem 2rem 0; }
.det-r h1 { margin: 0; font-size: 2.2rem; line-height: 1.1; color: var(--text-h); }
.det-r .hl { margin: .4rem 0 .7rem; color: var(--text-muted); font-size: 1.05rem; }
.chips { display: flex; flex-wrap: wrap; gap: .5rem; margin-bottom: 1rem; }
.warnline { color: var(--warning-text); font-weight: 600; margin: 0 0 .8rem; }
.ttabs { display: flex; align-items: center; gap: 1.6rem; border-bottom: 1px solid var(--line); margin-top: 1.2rem; }
.ttab { padding: .7rem 0; font-weight: 600; color: var(--text-muted); font-size: 1.05rem; border-bottom: .2rem solid transparent; margin-bottom: -1px; }
.ttab.on { color: var(--text-h); border-color: var(--primary); }
.ttabs .gl { opacity: .8; }
/* 1rem of side padding (pulled back with a negative margin) so focus rings and
   grown covers at the edges are never cut by the tab's scrolling area. */
.tbody { flex: 1 1 auto; min-height: 0; overflow-y: auto; padding: 1.2rem 1rem 2rem; margin: 0 -1rem; scrollbar-width: none; }
.tbody .track { margin: 0 -1.2rem; padding-left: 1.2rem; padding-right: 1.2rem; }
.ov { display: grid; grid-template-columns: 1fr 17rem; gap: 2rem; }
.prose { font-size: 1.1rem; line-height: 1.65; max-width: 44rem; border-radius: .6rem; padding: .4rem; margin: -.4rem; }
.prose p { margin: 0 0 .8rem; }
.facts { background: var(--surface); border-radius: .7rem; padding: 1rem 1.2rem; display: grid; gap: .7rem; align-content: start; font-size: .95rem; }
.facts dt { font-size: .7rem; text-transform: uppercase; letter-spacing: .05em; color: var(--text-muted); }
.facts dd { margin: .1rem 0 0; color: var(--text-h); }
.sub-h { margin: 1.4rem 0 .4rem; font-size: 1.1rem; color: var(--text-h); font-weight: 600; }
.sub-h span { color: var(--text-muted); font-weight: 400; margin-left: .4rem; }
.mtrack { display: flex; gap: 1rem; overflow-x: auto; overflow-y: hidden; padding: 1rem 1.2rem 1.2rem; margin: 0 -1.2rem; scrollbar-width: none; }
.mtile { flex: 0 0 auto; height: 8rem; border-radius: .6rem; background: var(--c); position: relative; overflow: hidden; }
.mtile::after { content: ''; position: absolute; left: 12%; bottom: 18%; width: 30%; height: 30%; border-radius: 50%; background: rgba(255,255,255,.14); }
.mtile .play { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: #fff; z-index: 1; }
.mtile.f { transform: scale(1.05); }
.lrow { display: flex; align-items: center; gap: 1rem; padding: .9rem 1.1rem; border-radius: .7rem; background: var(--surface); margin-bottom: .6rem; }
.lrow .t { color: var(--text-h); font-weight: 600; }
.lrow .s { color: var(--text-muted); font-size: .9rem; }
.lrow .grow { flex: 1; min-width: 0; }
.lrow.f { background: var(--selected); }
.latest { font-size: .7rem; font-weight: 700; letter-spacing: .06em; padding: .15rem .5rem; border-radius: .35rem; background: var(--primary); color: var(--on-primary); }
.badge { width: 3rem; height: 3rem; border-radius: .5rem; flex: 0 0 auto; background: var(--c, var(--field)); }
.badge.locked { filter: grayscale(1); opacity: .5; }
.seg { display: inline-flex; border-radius: 100px; background: var(--field); padding: .25rem; gap: .25rem; }
.seg button { padding: .45rem 1.3rem; border-radius: 100px; font-weight: 600; color: var(--text-muted); }
.seg button.on { background: var(--primary); color: var(--on-primary); }
.bar-h { display: flex; align-items: center; gap: 1rem; margin-bottom: 1rem; flex-wrap: wrap; }
.note { color: var(--text-muted); font-size: .95rem; margin: 0 0 1rem; max-width: 46rem; }
.note.warn { color: var(--warning-text); }

/* ---- Lists (Downloads, Settings, pages) */
.list { position: absolute; inset: 0; overflow-y: auto; padding: 1.2rem 2.4rem 2rem; scrollbar-width: none; }
.list-in { max-width: 70rem; margin: 0 auto; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 1rem; padding: 1.2rem 1.4rem; margin-bottom: 1.2rem; }
.panel > h2 { margin: 0 0 .8rem; font-size: 1.2rem; color: var(--text-h); font-weight: 600; }
.panel > h2 span { color: var(--text-muted); font-weight: 400; margin-left: .5rem; }
.dl { display: grid; grid-template-columns: 1fr 12rem auto; gap: 1.4rem; align-items: center; }
.kind { font-size: .7rem; font-weight: 700; letter-spacing: .05em; padding: .1rem .45rem; border-radius: .3rem; border: 1px solid var(--line-strong); color: var(--text-muted); margin-left: .5rem; vertical-align: .1rem; }
.pbar { height: .35rem; border-radius: .2rem; background: var(--field); overflow: hidden; margin-top: .5rem; }
.pbar b { display: block; height: 100%; background: var(--primary); transition: width 500ms linear; }
.spark { height: 2.6rem; border-radius: .5rem; background: var(--field); position: relative; overflow: hidden; }
.spark svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.err { color: var(--danger); }

.srow { display: flex; align-items: center; gap: 1.2rem; min-height: 4rem; padding: .7rem 1.2rem; border-radius: .7rem; margin-bottom: .4rem; }
.srow .lab { flex: 1; min-width: 0; }
.srow .lab .t { color: var(--text-h); font-size: 1.1rem; }
.srow .lab .s { color: var(--text-muted); font-size: .9rem; margin-top: .1rem; }
.srow .val { color: var(--text-muted); font-size: 1.05rem; display: flex; align-items: center; gap: .5rem; text-align: right; }
.srow.f { background: var(--selected); }
.srow.act .lab .t { color: var(--text-h); font-weight: 600; }
.srow.dng .lab .t { color: var(--danger); }
.srow.info { min-height: 3rem; }
.srow .chev { opacity: .6; }
.sw { width: 3.4rem; height: 1.9rem; border-radius: 100px; background: var(--field); border: 1px solid var(--line-strong); position: relative; flex: 0 0 auto; }
.sw::after { content: ''; position: absolute; top: .2rem; left: .2rem; width: 1.4rem; height: 1.4rem; border-radius: 50%; background: var(--text-muted); transition: left 150ms ease; }
.sw.on { background: var(--primary); border-color: transparent; }
.sw.on::after { left: 1.75rem; background: var(--on-primary); }
.sl { width: 12rem; height: .4rem; border-radius: .2rem; background: var(--field); position: relative; }
.sl b { position: absolute; left: 0; top: 0; bottom: 0; background: var(--primary); border-radius: .2rem; }
.sl i { position: absolute; top: 50%; width: 1.2rem; height: 1.2rem; border-radius: 50%; background: var(--text-h); transform: translate(-50%, -50%); }
.adj-arrows { display: none; }
.srow.f .adj-arrows { display: inline; color: var(--text-muted); }
.st { font-size: .85rem; font-weight: 600; padding: .15rem .6rem; border-radius: 100px; background: var(--field); color: var(--text-h); }
.st.warn { background: transparent; border: 1px solid var(--warning-text); color: var(--warning-text); }
.st.ok { color: var(--text-h); }
.st.ok::before { content: ''; display: inline-block; width: .5rem; height: .5rem; border-radius: 50%; background: var(--success); margin-right: .4rem; vertical-align: .05rem; }
.sgroup { margin: 1.2rem 1.2rem .4rem; font-size: .75rem; letter-spacing: .1em; text-transform: uppercase; color: var(--text-muted); font-weight: 600; }
.pane-h { display: flex; align-items: center; gap: 1rem; margin: 0 0 1rem; flex-wrap: wrap; }
.pane-h h1 { margin: 0; font-size: 1.6rem; color: var(--text-h); font-weight: 600; flex: 1; }
.split .pane { flex: 1 1 auto; min-width: 0; overflow-y: auto; scrollbar-width: none; background: var(--panel); border: 1px solid var(--line); border-radius: 1rem; padding: 1.4rem 1.6rem; margin-bottom: 1.2rem; }
.page { position: absolute; inset: 0; overflow-y: auto; padding: 1.6rem 2.4rem 2rem; scrollbar-width: none; }
.page-in { max-width: 62rem; margin: 0 auto; background: var(--panel); border: 1px solid var(--line); border-radius: 1rem; padding: 1.6rem 1.8rem; }
.page-in > h1 { margin: 0 0 .3rem; font-size: 1.9rem; color: var(--text-h); }
.page-in > .sub { color: var(--text-muted); margin: 0 0 1.2rem; font-size: 1.05rem; }
.path { font-family: ui-monospace, monospace; font-size: 1rem; color: var(--text-h); background: var(--field); padding: .5rem .8rem; border-radius: .4rem; margin-bottom: 1rem; }

/* ---- Startup screens (Connect, Choose your systems) */
/* The box always fits between the top bar and the hint bar: it never scrolls the
   screen. A long list (many systems) scrolls inside the box, under a fixed title
   and above fixed buttons. */
.start { position: absolute; inset: 0; display: flex; padding: 1.2rem 2.4rem; overflow: hidden; }

    var sp = $('lib-h').querySelector('.sp'); if (sp) sp.insertAdjacentHTML('beforebegin', '<span class="chip">GOG: <b>' + dv.sgames.length + ' games</b></span>');
    return;
  }
  if (!v || v.s.id !== 'gog' || !v.inst) return;
  var n = sInst(v.s).length, row = $('lib-h').querySelector('.vh-row');
  if (n && row) row.querySelector('.sp').insertAdjacentHTML('afterend', '<button class="btn" data-f data-k="sh-bk" data-a="sbackupall" data-al="Backup">Backup all ' + n + '…</button>');
  if (row) row.insertAdjacentHTML('beforeend', '<span class="chip">' + gl('RT') + ' Select</span>');
  var bar = $('selbar'); if (!bar) return;
  bar.hidden = !S.selMode; if (!S.selMode) return;
  var ids = S.ssel || [], gb = ids.reduce(function (t, id) { return t + sBkSrc(sG(id)).gb; }, 0), all = ids.length === n;
  bar.innerHTML = '<b>' + ids.length + ' selected · ' + gb.toFixed(1) + ' GB to write</b><span class="sp"></span><span class="hint">' + gl('X') + (all ? 'All ' + n + ' selected · Clear' : 'Select all ' + n) + '</span><span class="hint">' + gl('Y') + 'Backup to drive…</span><span class="hint">' + gl('RT') + 'Done</span>';
};
function sGogSel() { var v = sView(); return v && v.s.id === 'gog' && v.inst && S.tab === 'library' && !S.pages.length; }
var tvbRt = TABS.library.rt, tvbHints = TABS.library.hints;
TABS.library.rt = function () { if (sGogSel()) { S.selMode = !S.selMode; S.ssel = []; repaint(); return; } tvbRt(); };
TABS.library.hints = function () { return sGogSel() ? [['Y', 'Search'], ['RT', 'Select']] : tvbHints(); };
var tvbPick = selPick, tvbAll = selAll, tvbAct = selAct, tvbSelHints = selHints, tvbToggle = selToggle;
selPick = function (el) { if (!el.dataset.sid) return tvbPick(el); var i = S.ssel.indexOf(el.dataset.sid); if (i >= 0) S.ssel.splice(i, 1); else S.ssel.push(el.dataset.sid); repaint(); };
selAll = function () { if (!sGogSel()) return tvbAll(); var L = sInst(sst('gog')).map(function (g) { return g.id; }); S.ssel = S.ssel.length === L.length ? [] : L; repaint(); };
selAct = function () { if (!sGogSel()) return tvbAct(); if (!S.ssel.length) { toast('Pick games first'); return; } sBackupPage(S.ssel.slice(), 'Backup ' + S.ssel.length + ' game' + (S.ssel.length === 1 ? '' : 's')); };
selHints = function () {
  if (!S.selMode || !sGogSel() || S.layers.length) return tvbSelHints();
  var n = sInst(sst('gog')).length, on = cur && cur.dataset.sid && S.ssel.indexOf(cur.dataset.sid) >= 0;
  return [['A', on ? 'Unpick' : 'Pick'], ['X', S.ssel.length === n ? 'Clear all' : 'Select all'], ['Y', 'Backup to drive…'], ['RT', 'Done']];
};
selToggle = function () { S.ssel = []; tvbToggle(); };
S.ssel = [];

/* The Backup page for GOG games: the Game backups page's layout. */
function sBackupPage(ids, title) {
  var F = { drive: (readyDrives()[0] || {}).id };
  push(rowsPage({
    title: title, key: 'sbk',
    h1: function () { return esc(title); },
    sub: function () { return 'GRID writes each GOG game to the drive\'s gridpack folder: its installer files when GRID has them, else a copy of the installed game. Saves always go with it. Nothing downloads, and no GOG login is needed.'; },
    rows: function () {
      var R = [{ heading: 'Drive' }], ready = readyDrives();
      if (!ready.length) R.push({ note: 'No backup drive connected. Plug in a drive you set up for GRID, or set one up in Settings › Backup drives.', warn: 1 });
      ready.forEach(function (d) { R.push({ label: esc(d.name), sub: esc(d.label) + ' · ' + d.fs + ' · ' + d.free + ' GB free', radio: F.drive === d.id, fn: function () { F.drive = d.id; repaint(); } }); });
      var P = plan(); R.push({ heading: 'What goes on the drive' });
      P.rows.forEach(function (x) { R.push({ info: 1, label: esc(x.g.t), sub: 'GOG · ' + esc(x.src.note), val: '<span class="st ok">' + x.src.tag + '</span>' }); });
      if (P.rows.some(function (x) { return x.src.wine; })) R.push({ note: 'Windows games are copied without their Wine prefix. The save folders GOG reports are copied from it.' });
      if (ids.indexOf('g3') >= 0) R.push({ label: SBKSRC.g3.gone ? 'Prototype: Brightwater\'s installer is back' : 'Prototype: Brightwater\'s installer was moved', fn: function () { SBKSRC.g3.gone = !SBKSRC.g3.gone; repaint(); } });
      P.skip.forEach(function (t) { R.push({ note: esc(t) + ' is already on ' + esc(driveOf(F.drive).name) + ' and will be skipped.' }); });
      P.refuse.forEach(function (t) { R.push({ note: t, warn: 1 }); });
      return R;
    },
    main: function () {
      var P = plan(), n = P.rows.length, d = driveOf(F.drive), over = d && P.gb > d.free;
      return { label: over ? 'Not enough space' : n ? 'Backup ' + n + ' game' + (n === 1 ? '' : 's') : 'Nothing to backup', disabled: !n || over || !d, why: over ? 'Needs ' + P.gb.toFixed(1) + ' GB · ' + d.free + ' GB free' : 'Nothing new to write', summary: n ? P.gb.toFixed(1) + ' GB to write · nothing to download' : '', fn: function () {
        var b = ++BATCH, active = DL.some(function (x) { return x.st === 'active'; });
        P.rows.forEach(function (x, i) { DL.push({ id: 'sb' + b + '-' + x.g.id, sbk: x.g.id, how: x.src.how, ver: x.g.ver, t: x.g.t, st: !active && i === 0 ? 'active' : 'queued', pct: 0, kind: 'Backup', drive: d.id, batch: b, local: true }); });
        BATCH_INFO[b] = { games: n, emus: 0 }; S.selMode = false; S.ssel = []; pop();
        toast(n + ' game' + (n === 1 ? '' : 's') + ' added to the backup queue for ' + d.name, { act: ['Open Downloads', function () { S.pages = []; S.tab = 'downloads'; render(); }] });
      } };
    },
    mainHint: 'Backup'
  }));
  function plan() {
    var d = driveOf(F.drive), rows = [], skip = [], refuse = [];
    ids.forEach(function (id) {
      var g = sG(id);
      if (sJob(g)) { refuse.push(esc(g.t) + ' is being installed or updated. Wait for it to finish.'); return; }
      if (S.pages.some(function (p) { return p.title === 'Playing'; }) && g.played === 'today') { refuse.push(esc(g.t) + ' is running right now; close it to copy it.'); return; }
      if (d && sPackOf(d, g)) { skip.push(g.t); return; }
      rows.push({ g: g, src: sBkSrc(g) });
    });
    return { rows: rows, skip: skip, refuse: refuse, gb: rows.reduce(function (t, x) { return t + x.src.gb; }, 0) };
  }
}
function sRestore(g, dv) {
  var x = sPackOf(dv, g); if (!x || g.inst || sJob(g)) return;
  sQueue(g, 'restore', { how: x.how, from: dv.label, dname: dv.name, os: g.builds.indexOf('linux') >= 0 ? 'linux' : 'windows' });
  toast(g.t + ' added to download queue', { s: x.how === 'installer' ? 'Runs its installer from ' + dv.label : 'Copying from ' + dv.label, act: ['Open Downloads', function () { S.pages = []; S.tab = 'downloads'; render(); }] });
}
ACT.sbackup = function (el) { var g = sG(el.dataset.sid); sBackupPage([g.id], 'Backup ' + g.t); };
ACT.sbackupall = function () { var L = sInst(sst('gog')).map(function (g) { return g.id; }); sBackupPage(L, 'Backup GOG · ' + L.length + ' games'); };
ACT.srestore = function (el) { sRestore(sG(el.dataset.sid), driveOf(el.dataset.drive)); };
ACT.sdrm = function (el) { var g = sG(el.dataset.sid), d = driveOf(el.dataset.drive); confirmBox({ title: 'Remove ' + g.t + ' from ' + d.name + '?', body: 'Its files leave the drive. ' + (g.inst ? 'The copy installed on this computer stays.' : 'You can back it up again later.'), ok: 'Remove from drive', danger: 1, fn: function () { d.sgames = d.sgames.filter(function (x) { return x.id !== g.id; }); toast(g.t + ' removed from ' + d.name); pop(); } }); };

/* ---- RomM games whose archive holds a GOG offline installer ---- */
G.push({ id: 21, t: 'Grey Meridian', c: 'hsl(220 15% 34%)', p: 'WIN', native: 1, rel: 220, added: 13 },
  { id: 22, t: 'Foxglove', c: 'hsl(330 45% 40%)', p: 'WIN', native: 1, rel: 300, added: 14 },
  { id: 23, t: 'Iron Lullaby', c: 'hsl(15 35% 34%)', p: 'WIN', native: 1, rel: 400, added: 15 },
  { id: 24, t: 'Low Tide Radio', c: 'hsl(185 40% 34%)', p: 'WIN', native: 1, rel: 500, added: 16 },
  { id: 25, t: 'Pale Summit', c: 'hsl(210 25% 46%)', p: 'WIN', native: 1, rel: 600, added: 17 });
var RIT = { 'Grey Meridian': { type: 'exe' }, 'Foxglove': { type: 'exe', wizard: 1 }, 'Wren Hollow': { type: 'sh' }, 'Iron Lullaby': { type: 'exe', fail: 'unknown' }, 'Low Tide Radio': { type: 'exe', fail: 'dlc', base: 'Pale Summit' } };
var tvbInstall = install;
install = function (g) {
  tvbInstall(g);
  var r = RIT[g.t]; if (!r) return;
  var d = DL.filter(function (x) { return x.gid === g.id && (x.st === 'active' || x.st === 'queued'); }).pop(); if (d) { d.store = 'romm'; d.ri = r; }
};
function riLine(d) {
  if (d.st === 'queued') return 'Queued';
  if (d.pct < 55) return 'Downloading · ' + Math.round(d.pct / 55 * 100) + '% · 38.2 MB/s';
  var q = Math.round((d.pct - 55) / 45 * 100);
  return d.ri.type === 'sh' ? 'Unpacking the GOG installer ' + q + '%' : 'Running the GOG installer silently under ' + STV.compat + ' · ' + q + '%';
}
function riTvTick() {
  DL.forEach(function (d) {
    if (d.sbk && d.st === 'done' && !d.packed) { d.packed = 1; var dv = driveOf(d.drive); dv.sgames = dv.sgames || []; if (!sPackOf(dv, sG(d.sbk))) dv.sgames.push({ id: d.sbk, how: d.how, ver: d.ver }); }
    if (d.store !== 'romm') return;
    if (d.st === 'done' && !d.fixed) { d.fixed = 1; d.line = 'Installed · ran its GOG installer'; }
    if (d.st !== 'active') return;
    var r = d.ri;
    if (r.fail && d.pct >= 55) {
      d.st = 'failed';
      d.line = 'Failed · ' + (r.fail === 'unknown' ? 'Its archive holds an installer GRID doesn\'t recognise (setup.exe has no GOG game info). The download was removed.' : 'Its archive holds a DLC installer for ' + r.base + ', which isn\'t installed. Install ' + r.base + ' first; the download was removed.');
      var base = r.base && G.filter(function (x) { return x.t === r.base; })[0];
      toast('Couldn\'t install ' + d.t, { err: 1, s: r.fail === 'unknown' ? 'Its archive holds an installer GRID doesn\'t recognise.' : 'It\'s DLC for ' + r.base + ', which isn\'t installed.', act: base ? ['Install ' + r.base, function () { install(base); }] : ['Open Downloads', function () { S.pages = []; S.tab = 'downloads'; render(); }] });
      advanceQueue(); if (!S.layers.length) repaint(); return;
    }
    if (r.wizard && d.pct >= 70) { sSilentFailed(d); advanceQueue(); if (!S.layers.length) repaint(); }
  });
}
/* Details of such a RomM game: one line says what its archive holds. */
var tvbDetails = details;
details = function (g, drv) {
  var o = tvbDetails(g, drv), r = RIT[g.t]; if (!r) return o;
  var rr = o.render;
  o.render = function () { return rr.call(this).replace('<div class="lp">', '<div class="lp">' + (g.inst ? 'Installed by running its <b>GOG installer</b>' : 'Its archive holds a <b>GOG ' + (r.type === 'sh' ? 'Linux' : 'Windows') + ' installer</b>. GRID runs it after the download.') + '<br>'); };
  return o;
};

/* A drive's rail count includes its GOG games. */
var tvbRail = libRailHTML;
libRailHTML = function () {
  var h = tvbRail();
  readyDrives().forEach(function (d) { var n = (d.sgames || []).length; if (n) h = h.replace(new RegExp('(data-key="drv:' + d.id + '"[^>]*>[^<]*<span class="n">)(\\d+)'), function (m, a, c) { return a + (+c + n); }); });
  return h;
};

/* TV mode runs Windows installers silently only (user decisions 2026-11-13 and
   2026-11-14): no setup window ever opens over TV mode, and nothing sends the user to
   desktop mode. GRID runs the installer silently, then once more with milder silent
   flags; when both fail it keeps the installer and gives the reason read from the
   installer's log in GRID's words (here: not enough disk space). Retry runs both
   attempts again with the kept installer; the row also offers Delete installer. */
var SILENT_REASON = { w: 'there isn\'t enough disk space', s: 'There isn\'t enough disk space.' };
function sSilentFailed(d) {
  d.st = 'failed'; d.silentFail = 1;
  d.line = 'Failed · Couldn\'t run the installer silently: ' + SILENT_REASON.w + '. The installer was kept.';
  toast('Couldn\'t install ' + d.t + ' silently', { err: 1, s: SILENT_REASON.s, act: ['Retry', function () { sRetrySilent(d); }] });
}
function sRetrySilent(d) { d.st = d.store === 'romm' ? 'queued' : 'squeued'; d.pct = d.store === 'romm' ? 55 : 0; d.silentFail = 0; toast(d.t + ' added to download queue'); repaint(); }
/* Delete installer (asked first): the installer GRID kept goes, and so does the row. */
function sDeleteInstaller(d) {
  confirmBox({ title: 'Delete ' + d.t + '\u2019s installer?', body: (d.store === 'romm' ? 'The downloaded installer is deleted from this computer.' : 'The installer file and its parts are deleted from this computer.') + ' This can\u2019t be undone.', ok: 'Delete installer', danger: 1, fn: function () { DL.splice(DL.indexOf(d), 1); toast(d.t + '\u2019s installer deleted'); renderStage(); restoreFocus(); } });
}

/* ------------------------------------------------------------------ start */
document.documentElement.setAttribute('data-theme', 'dark');
sBoot(); render(); hero(sG('g1'));
setTimeout(function () { toast('Welcome to TV mode', { s: 'Press ' + GL[scheme()].MENU + ' for the menu and desktop mode.' }); }, 600);
})();

</script>
