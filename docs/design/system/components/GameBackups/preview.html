<!-- @dsCard group="Prototype" height=800 width=1280 subtitle="Game backups: copy games to a USB drive and install them from it, with or without a server" -->
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Game backups</title>
<style>
  html, body { height: 100%; overflow: hidden; }
  body { padding: 0; background: var(--bg); }
  .app { position: relative; height: 100vh; min-height: 420px; display: flex; flex-direction: column; overflow: clip; isolation: isolate; }
  .art-clip { position: absolute; inset: 0; overflow: clip; z-index: -1; pointer-events: none; }

  /* Background art: the last-viewed cover, blurred, under every panel. */
  .art { position: absolute; inset: -60px; filter: blur(40px); transition: opacity 220ms ease; }
  .art i { position: absolute; border-radius: 50%; }

  .view { flex: 1 1 auto; min-height: 0; position: relative; box-sizing: border-box; padding: var(--gutter); overflow-y: auto; }
  .view[hidden] { display: none; }
  .rail-divider { border: 0; border-top: 1px solid var(--line); margin: 6px 8px; }
  .columns { display: flex; align-items: stretch; gap: var(--gutter); height: 100%; min-height: 0; }
  .body { flex: 1 1 auto; min-width: 0; min-height: 0; display: flex; flex-direction: column; overflow-y: auto; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(var(--card-w, 160px), 1fr)); gap: 18px 14px; padding: var(--gutter) 2px 40px; }
  .grid.hover-labels { row-gap: 18px; }
  .grid.hover-labels .g-card { gap: 0; }
  .grid.hover-labels .g-label { position: absolute; top: calc(100% + 6px); left: 50%; transform: translateX(-50%); opacity: 0; width: max-content; max-width: calc(100% + 32px); background: var(--overlay); box-shadow: var(--shadow-lift); pointer-events: none; transition: opacity 150ms ease; }
  .grid.hover-labels .g-card:hover .g-label { opacity: 1; top: calc(100% + 6px); }
  .empty { align-self: flex-start; margin: var(--gutter) 0 0; padding: 10px 14px; color: var(--text-muted); font-size: 14px; }
  .content { max-width: 1100px; margin: 0 auto; display: flex; flex-direction: column; gap: var(--gutter); }

  /* Downloads */
  .seg { padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; }
  .seg h3 { margin: 0; font-size: 13px; font-weight: 600; color: var(--text-h); }
  .seg h3 span { color: var(--text-muted); font-weight: 400; margin-left: 6px; }
  .legend { margin: 0; font-size: 12px; color: var(--text-muted); padding: 10px 16px; }
  .dl { display: grid; grid-template-columns: 1fr 120px auto; gap: 14px; align-items: center; padding: 10px 12px; border-radius: var(--r-row); background: var(--surface); }
  .dl .t { color: var(--text-h); font-weight: 600; }
  .dl .s { font-size: 12px; color: var(--text-muted); }
  .bar { height: 4px; border-radius: 2px; background: var(--field); margin-top: 6px; overflow: hidden; }
  .bar b { display: block; height: 100%; background: var(--primary); }
  .kind { font-size: 10px; font-weight: 600; padding: 1px 6px; border-radius: var(--r-chip); border: 1px solid var(--border); color: var(--text-muted); margin-left: 6px; }
  .small-btn { font: inherit; font-size: 12px; padding: 5px 12px; border-radius: var(--r-control); border: 1px solid var(--border); background: transparent; color: var(--text); cursor: pointer; }
  .small-btn:hover { background: var(--surface); }
  .small-btn.primary { background: var(--primary); color: var(--on-primary); border-color: var(--primary); }
  .small-btn.primary:hover { background: var(--primary-hover); }
  .small-btn.ok { color: var(--text-muted); cursor: default; display: inline-flex; gap: 4px; align-items: center; }
  .small-btn.ok:hover { background: transparent; }

  /* Emulators / Settings panes */
  /* As in the app (Emulators.svelte, Settings.svelte): the panel is the whole
     column and stays put; only the page inside it scrolls. */
  .panes { flex: 1 1 auto; min-width: 0; height: 100%; min-height: 0; display: flex; flex-direction: column; overflow: hidden; }
  .pane-scroll { flex: 1 1 auto; min-height: 0; overflow-y: auto; }
  .pane { width: 100%; max-width: 1100px; margin: 0 auto; box-sizing: border-box; padding: 24px; display: flex; flex-direction: column; gap: 14px; }
  .pane h2 { margin: 0; font-size: 18px; font-weight: 600; color: var(--text-h); }
  .emu { padding: 12px 14px; border-radius: var(--r-row); border: 1px solid var(--line); background: var(--surface); display: flex; flex-direction: column; gap: 8px; }
  .emu-top { display: flex; align-items: baseline; gap: 10px; }
  .emu-top b { color: var(--text-h); font-size: 14px; }
  .emu-top code, .fw code { font-size: 12px; color: var(--text-muted); font-family: ui-monospace, monospace; }
  .emu-top .acts { margin-left: auto; display: flex; gap: 6px; }
  .fw { display: flex; align-items: center; gap: 10px; font-size: 12px; color: var(--text-muted); padding-top: 8px; border-top: 1px solid var(--line); }
  .fw .acts { margin-left: auto; }
  .setting { display: grid; grid-template-columns: 200px 1fr; align-items: center; gap: 12px; padding: 8px 0; border-bottom: 1px solid var(--line); }
  .setting:last-child { border-bottom: none; }
  .setting > span { color: var(--text-h); }
  .setting > .g-switch, .setting > .g-control { justify-self: start; }
  .setting small { display: block; color: var(--text-muted); font-size: 11px; }
  .setting input[type=range] { width: 240px; accent-color: var(--primary); }
  .note { margin: 0; color: var(--text-muted); font-size: 13px; }
  .pane-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .sub { display: flex; flex-direction: column; gap: 10px; }
  .sub h3 { margin: 0; font-size: 14px; font-weight: 600; color: var(--text-h); }
  .sub h4 { margin: 6px 0 0; font-size: 13px; font-weight: 600; color: var(--text-h); }
  .cat-list, .defaults, .radios, .moves { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
  .cat-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 9px 12px; border-radius: var(--r-row); background: var(--surface); border: 1px solid var(--line); }
  .cat-row .t, .umu .t { display: block; color: var(--text-h); font-weight: 600; }
  .cat-row .s { display: block; font-size: 12px; color: var(--text-muted); }
  .small-btn:disabled { opacity: .6; cursor: default; }
  .defaults { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 10px; }
  .dcard { display: flex; flex-direction: column; gap: 8px; padding: 12px 14px; border-radius: var(--r-row); background: var(--surface); border: 1px solid var(--line); }
  .dcard b { color: var(--text-h); }
  .dfield { display: flex; align-items: center; gap: 8px; font-size: 11px; color: var(--text-muted); }
  .dfield > span { width: 54px; flex: none; }
  .dfield .field { flex: 1; }
  .umu { padding: 12px 14px; border-radius: var(--r-row); background: var(--surface); border: 1px solid var(--line); display: flex; flex-direction: column; gap: 6px; }
  .umu-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .radios label { display: flex; align-items: center; gap: 8px; color: var(--text); cursor: pointer; }
  .radios input, .check input { accent-color: var(--primary); }
  .form { display: flex; flex-direction: column; gap: 12px; max-width: 520px; }
  .form label { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--text-muted); }
  .form label.check, .check { flex-direction: row; align-items: center; gap: 8px; font-size: 13px; color: var(--text); }
  .field { font: inherit; font-size: 13px; height: var(--control-h); box-sizing: border-box; padding: 0 10px; border-radius: var(--r-control); border: 1px solid var(--line-strong); background: var(--field); color: var(--text-h); }
  .field.narrow { width: 120px; }
  .inline { display: flex; gap: 8px; }
  .inline .field { flex: 1; }
  .inline .g-btn { padding: 0 14px; height: var(--control-h); }
  .form-actions, .choice { display: flex; flex-wrap: wrap; gap: 8px; }
  .form-actions .g-btn, .choice .g-btn, .update-line .g-btn { padding: 7px 16px; }
  .kv { margin: 0; display: flex; flex-direction: column; }
  .kv div { display: grid; grid-template-columns: 140px 1fr; gap: 12px; padding: 8px 0; border-bottom: 1px solid var(--line); }
  .kv dt { color: var(--text-muted); }
  .kv dd { margin: 0; color: var(--text-h); display: flex; align-items: center; }
  .path { display: block; padding: 8px 10px; border-radius: var(--r-control); background: var(--field); border: 1px solid var(--line); color: var(--text-h); font: 13px ui-monospace, monospace; }
  .line { margin: 0; color: var(--text-h); }
  .update-line { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .moves li { display: flex; justify-content: space-between; padding: 8px 12px; border-radius: var(--r-row); background: var(--surface); }
  .moves span { color: var(--text-muted); font-size: 12px; }
  .g-dialog.libdlg { width: 480px; height: auto; max-height: calc(100% - 48px); overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
  .libdlg h3 { margin: 0; font-size: 16px; color: var(--text-h); }


  /* Details sits inside the app frame here (fixed in the app). */
  .g-scrim[hidden] { display: none; }
  .g-dialog { width: min(1040px, calc(100% - 48px)); height: min(680px, calc(100% - 48px)); }
  .g-details-left { overflow-y: auto; }
  .tabpanel { flex: 1; min-height: 0; overflow-y: auto; padding-right: 4px; }
  .overview { display: flex; flex-wrap: wrap; align-items: flex-start; gap: 20px 28px; }
  .media-row { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 6px; }
  .shot { flex: none; width: 220px; aspect-ratio: 16/9; border-radius: var(--r-row); box-shadow: var(--shadow-card); }
  .sec-title { margin: 4px 0 8px; font-size: 13px; font-weight: 600; color: var(--text-h); }
  .save-row { display: flex; align-items: center; gap: 12px; padding: 9px 12px; border-radius: var(--r-row); background: var(--surface); margin-top: 8px; }
  .save-row .t { color: var(--text-h); }
  .save-row .s { color: var(--text-muted); font-size: 12px; margin-left: auto; }

  .toasts { position: absolute; left: 50%; transform: translateX(-50%); bottom: calc(var(--footer-h) + 24px); z-index: 30; display: flex; flex-direction: column; align-items: center; gap: 8px; pointer-events: none; }
  .toasts .g-toast { animation: toast-in 220ms ease; }
  @keyframes toast-in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  .g-strip[hidden] { display: none; }
  .menu-wrap { position: absolute; top: calc(100% + 6px); right: 0; z-index: 6; }
  .menu-wrap[hidden] { display: none; }

  .g-art::before { content:''; position:absolute; right:-18%; top:12%; width:70%; aspect-ratio:1; border-radius:50%; background:rgba(255,255,255,.12); }
  .g-art::after { content:''; position:absolute; left:10%; top:8%; width:34%; height:6px; border-radius:3px; background:rgba(255,255,255,.35); }
  .g-art { padding-bottom: 34px; }
  .g-art span { position:relative; text-shadow:0 1px 2px rgba(0,0,0,.35); }

  /* Proposed Emulators page */
  .lede { margin: 4px 0 0; color: var(--text-muted); font-size: 13px; }
  .pane-head > div:first-child { flex: 1 1 auto; min-width: 0; }
  .head-acts { display: flex; gap: 8px; flex: none; }
  .pane-head { align-items: flex-start; }
  .empty-state { display: flex; flex-direction: column; gap: 8px; padding: 20px; border-radius: var(--r-row); border: 1px dashed var(--line-strong); }
  .empty-state b { color: var(--text-h); font-size: 14px; }
  .emu2 { position: relative; padding: 12px 14px; border-radius: var(--r-row); border: 1px solid var(--line); background: var(--surface); display: flex; flex-direction: column; gap: 6px; }
  .emu2-top { display: flex; align-items: center; gap: 12px; }
  .emu2-name { display: flex; align-items: baseline; gap: 10px; min-width: 0; }
  .emu2-name b { color: var(--text-h); font-size: 14px; }
  .emu2-top .acts { margin-left: auto; display: flex; align-items: center; gap: 6px; }
  .meta2 { margin: 0; font-size: 12px; color: var(--text-muted); }
  .muted-s { font-size: 12px; color: var(--text-muted); font-weight: 400; }
  .warn-t { color: var(--warning-text); }
  .checks { display: flex; flex-direction: column; gap: 4px; margin-top: 2px; }
  .check-row, .fix { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--text); padding: 6px 0 0; border-top: 1px solid var(--line); }
  .fix { border-top: none; padding: 0; flex-wrap: wrap; }
  .fix > span:nth-child(2) { flex: 1 1 140px; }
  .fix .small-btn { margin-left: 26px; }
  .check-row .acts { margin-left: auto; }
  .st { flex: none; width: 18px; height: 18px; display: grid; place-items: center; border-radius: 50%; font-size: 11px; font-weight: 700; color: var(--text-muted); }
  .st.ok { color: var(--on-primary); background: var(--primary); }
  .st.warn { color: #1a1a12; background: var(--warning); }
  .tips summary { cursor: pointer; font-size: 12px; color: var(--text-muted); padding: 2px 0; }
  .tips summary:hover { color: var(--text-h); }
  .tips ul { margin: 6px 0 2px; padding-left: 18px; font-size: 13px; color: var(--text); }
  .tips[open] summary { color: var(--text-h); }
  .menu-anchor { position: relative; }
  .row-menu { position: absolute; right: 0; top: calc(100% + 4px); z-index: 8; min-width: 190px; }
  .row-menu .danger { color: var(--danger); }
  .rec { display: inline-block; margin-left: 6px; padding: 1px 8px; border-radius: var(--r-pill); font-size: 11px; font-weight: 600; background: var(--selected); color: var(--text-h); vertical-align: 1px; }
  .foot { margin-top: 4px; }
  .link { font: inherit; border: none; background: none; padding: 0; color: var(--primary); text-decoration: underline; cursor: pointer; }
  .link:hover { color: var(--primary-hover); }
  .dcard.attention { border-color: var(--warning); }
  .dhead { display: flex; align-items: baseline; justify-content: space-between; }
  .sheet2 { padding: 16px; border-radius: var(--r-row); border: 1px solid var(--line); background: var(--overlay); box-shadow: var(--shadow-lift); display: flex; flex-direction: column; gap: 12px; }
  .sheet2-head { display: flex; align-items: center; justify-content: space-between; }
  .sheet2-head h3 { margin: 0; font-size: 15px; color: var(--text-h); }
  .help { font-size: 11px; color: var(--text-muted); }
  .sub h3 + .radios, .sub h3 + .cat-list { margin-top: -2px; }
  /* Unified Systems tab */
  .sys-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
  .sysrow { border-radius: var(--r-row); border: 1px solid var(--line); background: var(--surface); }
  .sysrow.attention { border-color: var(--warning); }
  .sys-head { display: grid; grid-template-columns: minmax(0, 1fr) 260px 150px; align-items: center; gap: 12px; padding: 8px 12px 8px 6px; }
  .sys-toggle { display: flex; align-items: baseline; gap: 8px; min-width: 0; font: inherit; text-align: left; border: none; background: none; color: var(--text); padding: 4px 6px; border-radius: var(--r-control); cursor: pointer; }
  .sys-toggle:hover:not(:disabled) { background: var(--surface); }
  .sys-toggle:disabled { cursor: default; }
  .sys-toggle b { color: var(--text-h); font-size: 14px; white-space: nowrap; }
  .sys-toggle .chev { align-self: center; color: var(--text-muted); transition: transform 150ms ease; }
  .sysrow.open .chev { transform: rotate(90deg); }
  .sys-toggle:disabled .chev { visibility: hidden; }
  .sys-pick { width: 100%; }
  .pill-s { justify-self: start; display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 600; padding: 2px 10px; border-radius: var(--r-pill); color: var(--text-muted); border: 1px solid var(--line); white-space: nowrap; }
  .pill-s.ok { color: var(--text-h); }
  .pill-s.ok .g-icon { color: var(--primary); }
  .pill-s.warn { background: var(--warning); border-color: var(--warning); color: #1a1a12; }
  .pill-s.info { color: var(--text-h); border-color: var(--primary); }
  .sys-body { display: flex; flex-direction: column; gap: 8px; padding: 10px 14px 12px 34px; border-top: 1px solid var(--line); }
  .emu-line { display: flex; align-items: center; gap: 12px; }
  .emu-line b { color: var(--text-h); }
  .emu-line .acts { margin-left: auto; display: flex; align-items: center; gap: 6px; }
  .note.small { font-size: 12px; }

  /* Collapsing Server header */
  .sbody { position: relative; overflow: hidden; }
  .sscroll { flex: 1 1 auto; min-height: 0; overflow-y: auto; overflow-anchor: none; padding-top: var(--head-h, 116px); box-sizing: border-box; }
  .shead { position: absolute; top: 0; left: 0; right: var(--sb, 0px); z-index: 3;
    transition: padding 260ms cubic-bezier(.2,.7,.2,1), gap 260ms cubic-bezier(.2,.7,.2,1), background-color 260ms ease, box-shadow 260ms ease, border-color 260ms ease; }
  /* Folded, the bar floats over the cards: it becomes the overlay level
     (opaque), so no cover shows through the search field. */
  .shead.folded { padding-top: 8px; padding-bottom: 8px; gap: 0; background: var(--overlay); border-color: var(--line-strong); box-shadow: 0 10px 24px rgba(10, 10, 30, 0.22); }
  .shead-fold { display: grid; grid-template-rows: 1fr; transition: grid-template-rows 260ms cubic-bezier(.2,.7,.2,1); }
  .shead.folded .shead-fold { grid-template-rows: 0fr; }
  .shead-fold-in { min-height: 0; overflow: hidden; }
  /* The title row lifts and fades as it folds; the chips go a beat earlier.
     Unfolding, the row waits a moment so it appears into the space opening. */
  .shead-fold-in > header { transition: opacity 180ms ease 60ms, transform 260ms cubic-bezier(.2,.7,.2,1); }
  .shead .g-chips { transition: opacity 140ms ease 80ms; }
  .shead.folded .shead-fold-in > header { opacity: 0; transform: translateY(-8px); transition: opacity 160ms ease, transform 260ms cubic-bezier(.2,.7,.2,1); }
  .shead.folded .g-chips { opacity: 0; transition: opacity 100ms ease; }
  @media (prefers-reduced-motion: reduce) { .shead, .shead * { transition: none !important; } }

  /* Fresh startup (Connect, Choose your systems) and the setup card */
  .fresh { position: absolute; inset: 0; z-index: 100; background: var(--bg); overflow-y: auto; display: flex; justify-content: center; }
  .fresh[hidden] { display: none; }
  .fr-card { width: min(360px, 100%); margin: auto; padding: 32px 24px; box-sizing: border-box; display: flex; flex-direction: column; gap: 16px; }
  .fr-card.wide { width: min(720px, 100%); }
  .fr-card label { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--text-muted); }
  .fr-card label.check { flex-direction: row; align-items: center; gap: 8px; font-size: 13px; color: var(--text); }
  .fr-card .g-btn:disabled { opacity: .6; cursor: default; }
  .fr-head { display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center; }
  .fr-head h1 { margin: 0; font-size: 22px; font-weight: 600; color: var(--text-h); }
  .fr-head .lede { margin: 0; }
  .help.center { text-align: center; }
  .fr-row { display: grid; grid-template-columns: minmax(0, 1fr) 280px; align-items: center; gap: 12px; padding: 8px 12px; min-height: 36px; }
  .fr-row.ticked { border-color: var(--primary); background: var(--selected); }
  .fr-row.off { opacity: .7; }
  .fr-pick { flex-direction: row !important; align-items: baseline !important; gap: 10px !important; cursor: pointer; }
  .fr-pick input { align-self: center; accent-color: var(--primary); }
  .fr-pick b { color: var(--text-h); font-size: 14px; }
  .fr-foot { display: flex; flex-direction: column; align-items: flex-end; gap: 8px; }
  /* The one notification: a card in a stack at the bottom right, above the
     download strip and over dialogs. */
  .notes { position: absolute; right: 24px; bottom: calc(var(--footer-h) + 24px); z-index: 30; width: min(340px, calc(100% - 48px)); display: flex; flex-direction: column; gap: 8px; pointer-events: none; }
  .note-card { pointer-events: auto; display: flex; flex-direction: column; gap: 8px; padding: 12px 14px; box-sizing: border-box; border-radius: var(--r-row); border: 1px solid var(--border); background: var(--surface-2); box-shadow: 0 12px 32px rgba(0,0,0,.35); animation: note-in 220ms ease; transition: opacity 180ms ease, transform 180ms ease; }
  .note-card[hidden] { display: none; }
  .note-card.leaving { opacity: 0; transform: translateX(12px); }
  .note-card .title { margin: 0; font-weight: 600; color: var(--text-h); overflow-wrap: anywhere; }
  .note-card.error .title { color: var(--danger); }
  .note-card .line { margin: 0; font-size: 13px; color: var(--text); }
  .note-card .form-actions { justify-content: flex-end; }
  .note-card .bar { height: 4px; border-radius: var(--r-pill); background: var(--surface); overflow: hidden; margin: 0; }
  .note-card .bar b { display: block; height: 100%; background: var(--primary); transition: width 220ms ease; }
  @keyframes note-in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  /* Dismiss carries the auto-dismiss countdown: a bar along its bottom edge
     that runs down over 10 s. Pointing at the card pauses it. */
  .note-dismiss { position: relative; overflow: hidden; }
  .note-dismiss .cd { position: absolute; left: 0; bottom: 0; height: 3px; width: 100%; background: var(--primary); transform-origin: left center; animation: note-cd linear forwards; }
  .note-card:hover .cd, .note-card:focus-within .cd { animation-play-state: paused; }
  @keyframes note-cd { from { transform: scaleX(1); } to { transform: scaleX(0); } }
  /* The setup card's bar: one segment per install. Done is a solid fill,
     the one installing a moving fill, waiting ones empty. */
  .segbar { display: flex; gap: 3px; }
  .setup-seg { flex: 1 1 0; height: 4px; border-radius: var(--r-pill); background: var(--field); overflow: hidden; position: relative; }
  .setup-seg b { position: absolute; inset: 0; transform: scaleX(0); transform-origin: left center; background: var(--primary); }
  .setup-seg.done b { transform: scaleX(1); transition: transform 220ms ease; }
  .setup-seg.running b { transform: scaleX(1); opacity: .45; background: linear-gradient(90deg, transparent 0, var(--primary) 50%, transparent 100%); background-size: 200% 100%; animation: seg-run 1.2s linear infinite; }
  .setup-seg.failed { background: var(--danger); }
  @keyframes seg-run { from { background-position: 100% 0; } to { background-position: -100% 0; } }

  /* Light / dark toggle */
  .theme-toggle { color: var(--text-h); }
  .theme-start { position: absolute; top: 16px; right: 16px; z-index: 101; }
  .theme-start[hidden] { display: none; }
  .tt-icon { display: grid; place-items: center; }
  .tt-icon.spin { animation: tt-spin 300ms cubic-bezier(.2,.7,.2,1); }
  @keyframes tt-spin { from { opacity: 0; transform: rotate(-90deg) scale(.6); } to { opacity: 1; transform: none; } }
  /* While the theme changes, colours ease across instead of snapping. */
  html.theming, html.theming *, html.theming *::before, html.theming *::after { transition: background-color 240ms ease, color 240ms ease, border-color 240ms ease, fill 240ms ease, box-shadow 240ms ease !important; }
  @media (prefers-reduced-motion: reduce) { .tt-icon.spin { animation: none; } }

  /* Server › Discover */
  .discover { flex: 1 1 auto; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: var(--gutter); padding-bottom: 24px; }
  .discover[hidden], .shead[hidden], .sscroll[hidden] { display: none; }
  .disc-sec { padding: 16px; display: flex; flex-direction: column; gap: 12px; }
  .disc-head h2 { margin: 0; font-size: 18px; font-weight: 600; color: var(--text-h); }
  .disc-head .lede { margin: 2px 0 0; }
  /* Recently added: platform filter pills across the top, beside the title. */
  .ra-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .ra-pills { flex-wrap: wrap; max-width: 100%; }

  /* New releases: a coverflow. Centre cover flat and lit; neighbours tilt
     52° back, recede and dim; a soft reflection under each. */
  /* isolation: the covers' and arrows' z-index rank only inside the coverflow,
     never against the app's overlays. */
  .cf { position: relative; height: 330px; outline: none; border-radius: var(--r-row); isolation: isolate; }
  .cf:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  /* Clipped left and right only: the reflections run down below the stage,
     under the caption, and fade out there. */
  .cf-stage { position: absolute; inset: 0; perspective: 1100px; overflow-x: clip; overflow-y: visible; }
  .cf-item { position: absolute; left: 50%; top: 14px; width: 200px; margin-left: -100px; cursor: pointer; transform-style: preserve-3d;
    transition: transform 450ms cubic-bezier(.2,.7,.2,1), opacity 450ms ease, filter 450ms ease; filter: brightness(.62) saturate(.85); }
  .cf-item.center { filter: none; }
  .cf-cover { position: relative; aspect-ratio: 3 / 4; border-radius: var(--r-card); overflow: hidden; box-shadow: var(--shadow-card);
    -webkit-box-reflect: below 6px linear-gradient(transparent 46%, rgba(255, 255, 255, 0.24)); }
  .cf-item.center .cf-cover { box-shadow: var(--shadow-lift); }
  .cf-arrow { position: absolute; top: 50%; margin-top: -24px; z-index: 60; width: 36px; height: 48px; background: var(--overlay); box-shadow: var(--shadow-lift); }
  .cf-arrow.prev { left: 8px; } .cf-arrow.next { right: 8px; }
  .cf-arrow:disabled { opacity: .35; cursor: default; }
  .cf-caption { position: relative; z-index: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; text-align: center; }
  .cf-caption b, .ra-caption b { color: var(--text-h); font-size: 18px; }
  .cf-caption .form-actions { margin-top: 6px; }

  /* Recently added: a screenshot, and a column of small covers whose
     highlight frame glides to the active game every 10 s. */
  .ra { display: grid; grid-template-columns: minmax(0, 1fr) 250px; gap: 16px; }
  .ra-main { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
  .ra-shot { position: relative; aspect-ratio: 16 / 9; border-radius: var(--r-row); overflow: hidden; box-shadow: var(--shadow-card); background: var(--field); cursor: pointer; transition: transform 150ms ease, box-shadow 150ms ease; }
  .ra-shot:hover { transform: translateY(-2px); box-shadow: var(--shadow-lift); }
  .ra-shot:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  .cf-item.center:hover .cf-cover { transform: translateY(-4px); }
  .cf-cover { transition: transform 150ms ease; }
  .ra-layer { position: absolute; inset: 0; opacity: 0; transition: opacity 600ms ease; }
  .ra-layer.on { opacity: 1; }
  .ra-art { position: absolute; inset: 0; }
  .ra-art span { position: absolute; left: 8%; bottom: 14%; width: 46%; height: 34%; border-radius: 10px; background: rgba(255,255,255,.14); }
  .ra-art i { position: absolute; right: 10%; top: 16%; width: 26%; aspect-ratio: 1; border-radius: 50%; background: rgba(255,255,255,.18); }
  .ra-caption { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .ra-caption > div:first-child { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .ra-side { position: relative; }
  .ra-list { position: absolute; inset: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; padding: 0 2px; scrollbar-width: thin; }
  .ra-row { position: relative; z-index: 1; display: flex; align-items: center; gap: 10px; padding: 6px; border: none; border-radius: var(--r-row); background: transparent; color: var(--text); font: inherit; text-align: left; cursor: pointer; flex: none; }
  .ra-row:hover:not(.active) { background: var(--surface); }
  .ra-cover { position: relative; flex: none; width: 46px; aspect-ratio: 3 / 4; border-radius: 6px; overflow: hidden; box-shadow: var(--shadow-card); }
  .ra-cover .g-art { padding: 0; font-size: 0; }
  .ra-cover .g-art::after { display: none; }
  .ra-text { display: flex; flex-direction: column; min-width: 0; }
  .ra-text b { color: var(--text-h); font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ra-text span { color: var(--text-muted); font-size: 11px; }
  .ra-row.active .ra-text b { color: var(--text-h); }
  .ra-hl { position: absolute; left: 2px; right: 2px; top: 0; z-index: 0; border-radius: var(--r-row); background: var(--selected); box-shadow: inset 0 0 0 2px var(--primary); overflow: hidden; pointer-events: none;
    transition: transform 450ms cubic-bezier(.2,.7,.2,1), height 450ms cubic-bezier(.2,.7,.2,1); }
  .ra-bar { position: absolute; left: 0; bottom: 0; height: 3px; width: 100%; background: var(--primary); transform: scaleX(0); transform-origin: left center; animation: ra-fill 10s linear forwards; }
  .ra:hover .ra-bar, .ra:focus-within .ra-bar { animation-play-state: paused; }
  @keyframes ra-fill { to { transform: scaleX(1); } }
  @media (prefers-reduced-motion: reduce) { .cf-item, .ra-hl, .ra-layer { transition: none; } }

  /* Off-ratio screenshots: fitted in the 16:9 frame over a blurred copy. */
  .ra-fill { position: absolute; inset: -12%; filter: blur(26px) brightness(.55) saturate(1.15); transform: scale(1.1); }
  .ra-fill span { position: absolute; left: 8%; bottom: 14%; width: 46%; height: 34%; border-radius: 10px; background: rgba(255,255,255,.14); }
  .ra-fill i { position: absolute; right: 10%; top: 16%; width: 26%; aspect-ratio: 1; border-radius: 50%; background: rgba(255,255,255,.18); }
  .ra-pic { position: absolute; inset: 0; margin: auto; overflow: hidden; box-shadow: 0 0 24px rgba(0,0,0,.35); }
  .ra-pic.tall { height: 100%; width: auto; }
  .ra-pic.wide { width: 100%; height: auto; }
  /* Clear logo: bottom-left on the art, over a soft fade so a light logo
     reads on any screenshot. */
  .ra-logo-wrap { position: absolute; left: 0; right: 0; bottom: 0; padding: 40px 20px 16px; background: linear-gradient(to top, rgba(0,0,0,.6), rgba(0,0,0,0)); pointer-events: none; }
  .ra-logo { max-width: 55%; line-height: 1; color: #fff; overflow-wrap: anywhere; }
  /* --lf: letters, --ls: outline and shadow. A server logo stand-in keeps the
     defaults; a generated logo sets both from the screenshot's dominant shade. */
  .logo-a { font: italic 700 34px/1 Georgia, 'Times New Roman', serif; color: var(--lf, #f6d77a); text-shadow: 0 2px 0 var(--ls, #6b4a0e), 0 4px 12px rgba(0,0,0,.6); }
  .logo-b { font: 900 30px/0.95 system-ui, sans-serif; text-transform: uppercase; letter-spacing: .04em; color: var(--lf, #fff); -webkit-text-stroke: 1px rgba(0,0,0,.6); text-shadow: 3px 3px 0 var(--ls, #553e98), 0 4px 14px rgba(0,0,0,.6); }
  .logo-c { font: 800 32px/1 system-ui, sans-serif; letter-spacing: -.01em; color: var(--lf, #eafcff); text-shadow: 0 0 1px var(--ls, #0b3b46), 0 3px 0 var(--ls, #0b3b46), 0 5px 14px rgba(0,0,0,.55); }

  /* Game backups: Settings › Backup drives, the backup dialog, grid select
     mode, Library › Backup drives and the offline Server panel. */
  .bk-lede { max-width: 620px; }
  .bk-drive { position: relative; display: flex; flex-direction: column; gap: 10px; padding: 14px 16px; border-radius: var(--r-row); border: 1px solid var(--line); background: var(--surface); }
  .bk-drive + .bk-drive { margin-top: 10px; }
  .bk-drive.away { opacity: .72; }
  .bk-drive.fresh-drive { border-style: dashed; border-color: var(--line-strong); }
  .bk-drive-head { display: flex; align-items: center; gap: 10px; padding-right: 120px; }
  .bk-drive-icon { display: inline-grid; place-items: center; width: 34px; height: 34px; border-radius: var(--r-control); background: var(--field); color: var(--text-h); flex: none; }
  .bk-drive-id { display: flex; flex-direction: column; gap: 1px; min-width: 0; margin-right: auto; }
  .bk-drive-id b { color: var(--text-h); font-size: 14px; }
  .bk-drive .kv div { grid-template-columns: 120px 1fr; padding: 6px 0; }
  .bk-drive code, .bk-confirm code, .bk-setup code { font: 12px ui-monospace, monospace; }
  .bk-usage { position: relative; display: flex; height: 8px; border-radius: var(--r-pill); background: var(--field); overflow: hidden; }
  .bk-usage b { display: block; height: 100%; }
  .bk-usage b.u-other { background: var(--line-strong); }
  .bk-usage b.u-grid { background: var(--primary); }
  .bk-usage b.adding { background: repeating-linear-gradient(135deg, var(--graph-disk) 0 4px, color-mix(in srgb, var(--graph-disk) 55%, transparent) 4px 8px); }
  .bk-usage b.adding.over { background: var(--danger); }
  .bk-legend { margin: -2px 0 0; display: flex; flex-wrap: wrap; gap: 14px; font-size: 12px; color: var(--text-muted); }
  .bk-legend i { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 5px; background: var(--field); border: 1px solid var(--line-strong); vertical-align: -1px; }
  .bk-legend i.u-other { background: var(--line-strong); border-color: transparent; }
  .bk-legend i.u-grid { background: var(--primary); border-color: transparent; }
  .bk-warn { margin: 0; padding: 8px 10px; border-radius: var(--r-control); border-left: 3px solid var(--warning); background: color-mix(in srgb, var(--warning) 12%, transparent); color: var(--text); font-size: 13px; }
  .bk-warn-line { color: var(--warning-text); }
  .bk-confirm { display: flex; flex-direction: column; gap: 10px; padding: 10px 12px; border-radius: var(--r-control); border: 1px solid var(--danger); }
  .bk-confirm p { margin: 0; font-size: 13px; color: var(--text); }
  .bk-rename { display: flex; gap: 8px; align-items: center; }
  .bk-rename .field { max-width: 280px; }
  .bk-proto { font-size: 11px; padding: 3px 8px; border-style: dashed; color: var(--text-muted); }
  .bk-proto-corner { position: absolute; top: 12px; right: 12px; }
  .bk-tree summary { cursor: pointer; color: var(--text-h); font-size: 14px; font-weight: 600; }
  .bk-tree pre { margin: 8px 0 0; padding: 10px 12px; border-radius: var(--r-control); background: var(--field); border: 1px solid var(--line); color: var(--text-h); font: 12px/1.6 ui-monospace, monospace; overflow-x: auto; }

  /* Select mode on the grids */
  .bk-select-btn.active { background: var(--primary); color: var(--on-primary); border-color: var(--primary); }
  .grid.selecting .g-card { cursor: pointer; }
  .grid.selecting .g-bar, .grid.selecting .g-shade { display: none; }
  .grid.selecting .g-cover { transition: transform 120ms ease, box-shadow 120ms ease; }
  .grid.selecting .g-card.picked .g-cover { box-shadow: 0 0 0 3px var(--primary), var(--shadow-card); transform: scale(.96); }
  .bk-check { position: absolute; top: 8px; left: 8px; z-index: 3; width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; border: 2px solid #fff; background: rgba(0,0,0,.35); color: var(--on-primary); box-shadow: 0 1px 3px rgba(0,0,0,.4); }
  .g-card.picked .bk-check { background: var(--primary); border-color: var(--primary); }
  .grid.selecting .g-tag-stack { top: 36px; }
  .bk-selbar { position: sticky; bottom: 0; z-index: 4; display: flex; align-items: center; gap: 10px; padding: 10px 14px; margin-top: 8px; border-radius: var(--r-row); background: var(--overlay); box-shadow: 0 -6px 24px rgba(0,0,0,.18); }
  .bk-selbar[hidden] { display: none; }
  .bk-sel-count { display: flex; flex-direction: column; gap: 1px; }
  .bk-sel-count b { color: var(--text-h); font-size: 14px; }
  .bk-sel-gap { flex: 1 1 auto; }
  .bk-selbar .g-btn { padding: 7px 16px; }
  .bk-selbar .g-btn:disabled { opacity: .55; cursor: default; }
  .g-platform-header { position: relative; }
  .bk-plat { margin-left: 8px; white-space: nowrap; }
  .bk-plat[hidden] { display: none; }

  /* Library › Backup drives rail rows */
  .bk-rail { justify-content: flex-start; }
  .bk-rail .g-rail-label { flex: 1 1 auto; text-align: left; }
  .bk-rail .bk-rail-icon { display: inline-grid; place-items: center; flex: none; color: var(--text-muted); margin-right: 8px; }
  .bk-rail.active .bk-rail-icon { color: inherit; }
  #lib-chips[hidden] { display: none; }

  /* The backup dialog */
  .g-dialog.bkdlg { position: relative; width: 520px; height: auto; max-height: calc(100% - 48px); overflow-y: auto; display: flex; flex-direction: column; gap: 14px; padding: 22px 24px; box-sizing: border-box; }
  .bkdlg h3 { margin: 0; padding-right: 36px; font-size: 17px; color: var(--text-h); }
  .bkdlg .sub { gap: 8px; }
  .bkdlg h4 { margin: 0; font-size: 12px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--text-muted); }
  .bk-opts { display: flex; flex-direction: column; gap: 8px; }
  .bk-opt { display: grid; grid-template-columns: auto 1fr auto; grid-template-areas: "r m f" "u u u"; align-items: center; gap: 6px 10px; padding: 10px 12px; border-radius: var(--r-row); border: 1px solid var(--line); background: var(--surface); cursor: pointer; }
  .bk-opt input { grid-area: r; accent-color: var(--primary); }
  .bk-opt.on { border-color: var(--primary); background: var(--selected); }
  .bk-opt-main { grid-area: m; display: flex; flex-direction: column; gap: 1px; }
  .bk-opt-main b { color: var(--text-h); }
  .bk-opt-free { grid-area: f; font-size: 12px; color: var(--text-muted); }
  .bk-opt-free.warn { color: var(--danger); font-weight: 600; }
  .bk-opt .bk-usage { grid-area: u; height: 6px; }
  .bk-also { display: flex; flex-direction: row; align-items: flex-start !important; gap: 10px; font-size: 13px; color: var(--text); }
  .bk-also input:disabled + span { opacity: .6; }
  .bk-also input { margin-top: 3px; }
  .bk-also > span { display: flex; flex-direction: column; gap: 1px; }
  .bk-also b { color: var(--text-h); font-weight: 600; }
  .bk-notes { display: flex; flex-direction: column; gap: 4px; padding: 8px 10px; border-radius: var(--r-control); background: var(--field); }
  /* Source: the checkbox, where each game comes from, the out-of-date choice */
  .bk-src-wine { margin: 0; font-size: 12px; }
  .bk-src-list { list-style: none; margin: 0; padding: 0; border: 1px solid var(--line); border-radius: var(--r-row); background: var(--surface); }
  .bk-src-list li { display: flex; align-items: center; gap: 10px; padding: 7px 12px; font-size: 13px; }
  .bk-src-list li + li { border-top: 1px solid var(--line); }
  .bk-src-name { display: flex; flex-direction: column; gap: 1px; min-width: 0; margin-right: auto; }
  .bk-src-name b { color: var(--text-h); font-weight: 600; }
  .bk-src-tag { display: inline-flex; align-items: center; gap: 5px; flex: none; padding: 2px 8px; border-radius: var(--r-pill); font-size: 12px; color: var(--text-muted); background: var(--field); white-space: nowrap; }
  .bk-src-tag.local { color: var(--text-h); background: var(--selected); }
  .bk-src-tag.ask { color: var(--warning-text); background: color-mix(in srgb, var(--warning) 14%, transparent); }
  .bk-src-each summary { cursor: pointer; font-size: 13px; color: var(--text-h); padding: 2px 0; }
  .bk-src-each summary .note { margin-left: 4px; }
  .bk-src-each[open] summary { margin-bottom: 6px; }
  .bk-outdated { display: flex; flex-direction: column; gap: 10px; padding: 10px 12px; border-radius: var(--r-control); border-left: 3px solid var(--warning); background: color-mix(in srgb, var(--warning) 10%, transparent); }
  .bk-outdated-head { margin: 0; display: flex; flex-direction: column; gap: 1px; font-size: 13px; }
  .bk-outdated-head b { color: var(--text-h); }
  .bk-outdated-bulk { display: flex; gap: 8px; flex-wrap: wrap; }
  .bk-choice { margin: 0; padding: 0; border: 0; display: flex; flex-direction: column; gap: 4px; }
  .bk-choice legend { padding: 0; margin-bottom: 4px; font-size: 13px; color: var(--text); }
  .bk-choice legend b { color: var(--text-h); }
  .bk-choice .check { padding-left: 2px; }
  .bk-foot { align-items: center; justify-content: flex-end; }
  .bk-foot > .note { margin-right: auto; flex: 1 1 0; min-width: 0; }
  .bk-foot .g-btn:disabled { opacity: .55; cursor: default; }

  /* Details */
  .bk-on { display: flex; align-items: center; justify-content: center; gap: 5px; }
  .bk-src { color: var(--primary); }

  /* Offline */
  .g-status-dot.bk-offline-dot { background: var(--text-muted); }
  .bk-off { flex: 1 1 auto; display: grid; place-items: center; padding: 40px; }
  .bk-off[hidden] { display: none; }
  .bk-off-in { max-width: 420px; display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center; }
  .bk-off-in h2 { margin: 0; font-size: 18px; color: var(--text-h); }
  .bk-off-in .bk-drive-icon { width: 48px; height: 48px; }
  .bk-or { display: flex; align-items: center; gap: 10px; color: var(--text-muted); font-size: 12px; }
  .bk-or::before, .bk-or::after { content: ''; flex: 1; border-top: 1px solid var(--line); }
  #bkscrim { z-index: 25; }
  .bk-os { display: flex; flex-direction: column; gap: 6px; margin: 0; padding: 0; border: 0; }
  .bk-os legend { padding: 0; margin-bottom: 4px; font-size: 12px; color: var(--text-muted); }
  .bk-os-edit { padding: 10px 12px; border-radius: var(--r-control); border: 1px solid var(--line); }
  .bk-for { margin: 0; display: flex; align-items: center; gap: 8px; font-size: 13px; }
  .bk-for b { color: var(--text-h); }
  .bk-auto { display: flex; align-items: flex-start; gap: 10px; font-size: 13px; color: var(--text); }
  .bk-auto-mark { display: inline-grid; place-items: center; width: 15px; height: 15px; margin-top: 2px; border-radius: 3px; background: var(--primary); color: var(--on-primary); flex: none; }

<div class="app" id="app">

        <div class="g-menu" role="menu"><button role="menuitem">Disconnect</button><button role="menuitem">Open RomM in browser</button><span class="g-menu-host">romm.home.lan</span></div>
      </div>
    </div>
  </header>

  <div class="view" data-view="library" hidden>
    <div class="columns">
      <nav class="g-rail" id="lib-rail" aria-label="Library filters"></nav>

  <div class="view" data-view="server">
    <div class="columns">

      <div class="g-panel bk-off" id="bk-srv-off" hidden><div class="bk-off-in"><span class="bk-drive-icon" data-icon="cloud" data-size="24"></span><h2>Not connected to a server</h2><p class="note">Your Library and backup drives work without one. Connect to browse the server and back up games.</p><button class="g-btn" data-bk-connect>Connect to a server…</button></div></div>
      <div class="body sbody" id="srv-body">
        <div class="g-panel g-head shead" id="srv-head"><div class="shead-fold"><div class="shead-fold-in">

function startInstall(g, fromQueue){
  if (S.dl) {
    if (S.dl.id !== g.id && DLQ.indexOf(g.id) < 0) { DLQ.push(g.id); toast('Added to download queue'); renderAll(); }
    return;
  }
  S.dl = { id: g.id, pct: 0, speed: 30 }; spark = []; for (var i=0;i<60;i++) spark.push(2);
  if (!fromQueue) toast('Added to download queue');
  var timer = setInterval(function(){
    if (!S.dl) { clearInterval(timer); return; }
    S.dl.speed = 28 + Math.random()*16; S.dl.pct = Math.min(100, S.dl.pct + 4 + Math.random()*4);
    spark.push(4 + Math.random()*11); spark.shift();
    if (S.dl.pct >= 100) { clearInterval(timer); renderDownloads(); setTimeout(function(){ G[S.dl.id].installed = true; toast(G[S.dl.id].t + ' installed'); addDone(G[S.dl.id].t, '', PLAT[G[S.dl.id].p] + ' · Finished'); S.dl = null; renderAll(); if (DLQ.length) startInstall(G[DLQ.shift()], true); }, 900); }
    renderDownloads();
  }, 400);
  renderAll();
}

function syPlaceMenu() {
  var m = document.querySelector('#set-pane .row-menu');
  if (!m) return;
  var b = m.parentNode.querySelector('[data-sy-more]').getBoundingClientRect();
  var win = document.getElementById('app').getBoundingClientRect();
  m.style.position = 'fixed'; m.style.right = 'auto'; m.style.left = '0px'; m.style.top = '0px';
  var w = m.offsetWidth, h = m.offsetHeight, top, left;
  var minX = win.left + SY_EDGE, maxX = win.right - SY_EDGE, minY = win.top + SY_EDGE, maxY = win.bottom - SY_EDGE;
  if (b.bottom + SY_GAP + h <= maxY) {
    top = b.bottom + SY_GAP;
    left = Math.max(minX, Math.min(b.right - w, maxX - w));
    m.dataset.side = 'below';
  } else {
    top = Math.max(minY, Math.min(b.top, maxY - h));
    if (b.left - SY_GAP - w >= minX) { left = b.left - SY_GAP - w; m.dataset.side = 'left'; }
    else { left = Math.min(b.right + SY_GAP, maxX - w); m.dataset.side = 'right'; }
  }

}

  }
  if (e.target === $('scrim') || e.target.closest('#close')) { closeDetails(); return; }
  var tb = e.target.closest('[data-tab]'); if (tb) { S.tab = tb.getAttribute('data-tab'); renderDetails(); return; }
  var kd = e.target.closest('[data-k]'); if (kd) { S.kind = kd.getAttribute('data-k'); renderDetails(); return; }
  var d = e.target.closest('[data-d]');
  if (d) { var a2 = d.getAttribute('data-d'); if (a2 === 'install') startInstall(S.detail); else if (a2 === 'play') { S.playing = S.detail.id; toast('Launching ' + S.detail.t + '…'); renderDetails(); } else if (a2 === 'uninstall') { if (d.textContent === 'Confirm uninstall') { S.detail.installed = false; toast(S.detail.t + ' uninstalled'); renderAll(); } else { d.textContent = 'Confirm uninstall'; d.classList.add('confirm'); } } }
});
document.addEventListener('input', function(e){ var k = e.target.getAttribute && e.target.getAttribute('data-search'); if (k) { S.q[k] = e.target.value; k === 'server' ? renderServer() : renderLibrary(); } });
document.addEventListener('change', function(e){ var df = e.target.getAttribute && e.target.getAttribute('data-default'); if (df) { DEFAULTS[df] = e.target.value; EMU[df] = e.target.value === 'RetroArch' ? 'RetroArch · ' + (CORES[df] || ['core'])[0] : e.target.value; renderEmulators(); renderServer(); return; } var cd = e.target.getAttribute && e.target.getAttribute('data-compat'); if (cd) { S.compatDefault = cd; return; } var ck = e.target.getAttribute && e.target.getAttribute('data-cloud'); if (ck) { S.cloud[ck] = e.target.checked; return; } if (e.target.hasAttribute && e.target.hasAttribute('data-size-select')) { S.cardW = +e.target.value; syncSize(); renderAll(); } });
document.addEventListener('keydown', function(e){
  if (e.key === 'Escape') { if (!$('libscrim').hidden) closeLibChange(); else if (S.detail) closeDetails(); $('menu').hidden = true; }
  if ((e.ctrlKey || e.metaKey) && /^[1-4]$/.test(e.key)) { e.preventDefault(); S.view = VIEWS[+e.key - 1]; renderAll(); }
});
document.querySelector('#app').addEventListener('mouseover', function(e){ var c = e.target.closest('[data-game]'); if (c && S.fade < 100) { var id = +c.getAttribute('data-game'); if (S.hoverId !== id) { S.hoverId = id; clearTimeout(S.hoverT); S.hoverT = setTimeout(function(){ S.lastViewed = id; paintArt(G[id]); }, 600); } } });

function renderAll(){ renderPills(); renderServer(); renderLibrary(); renderDownloads(); renderEmulators(); renderSettings(); renderDetails(); }
bkBoot();
})();
</script>
