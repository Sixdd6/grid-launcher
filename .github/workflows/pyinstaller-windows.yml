name: Build Windows

on:
  workflow_dispatch:
  release:
    types:
      - created

permissions:
  contents: write

jobs:
  build:
    name: Build with PyInstaller
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Detect version
        id: version
        shell: bash
        run: |
          VERSION=$(git describe --tags --always --dirty 2>/dev/null || echo "0.0.0-dev")
          VERSION="${VERSION#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building version: $VERSION"

      - name: Generate version module
        shell: bash
        run: |
          cat > grid_launcher/version.py <<EOF
          """Application version (generated by CI)."""

          __version__ = "${{ steps.version.outputs.version }}"
          EOF

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller

      - name: Stage bundled assets
        run: python scripts\stage_assets.py --platform windows --output build\bundle-assets

      - name: Build executable
        run: |
          pyinstaller --noconfirm --clean --windowed --onefile --name grid-launcher --icon assets\icons\grid-launcher.ico --add-data "build\bundle-assets;assets" --add-data "retroarch-core-list.json;." --add-data "emulator-autoprofiles.json;." --add-data "romm-platform-cores.json;." --hidden-import brotli --hidden-import pyzstd --hidden-import pyppmd --hidden-import certifi --hidden-import keyring.backends.Windows grid-launcher.py

      - name: Rename artifact
        id: artifact
        run: |
          $NAME = "grid-launcher-${{ steps.version.outputs.version }}-windows-x86_64.exe"
          Rename-Item -Path "dist\grid-launcher.exe" -NewName $NAME
          Add-Content -Path $env:GITHUB_OUTPUT -Value "name=$NAME"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: dist/${{ steps.artifact.outputs.name }}
          if-no-files-found: error

      - name: Attach exe to release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/${{ steps.artifact.outputs.name }}
