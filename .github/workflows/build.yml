name: Build

# One pipeline for the Rust app. It runs only when a `v*` tag is pushed or
# when started by hand (workflow_dispatch), never on a branch push or pull
# request: local checks gate day-to-day work. A tag push runs the gates and
# the end-to-end suite, builds the artifacts, and attaches them to the tag's
# DRAFT release (creating the draft if there is none). It never publishes:
# the maintainer publishes the draft once all five files are on it, so users
# (and the app's update check, which reads releases/latest) never see a
# release without its files. A workflow_dispatch run does everything as a
# dry run — it builds version 0.0.0-dev, uploads to the run, and attaches
# nothing.
#
# GitHub starts no workflow for a draft release's events, which is why the
# trigger is the tag push and not the draft. Publishing starts nothing.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

# A moved tag (a fix after a failed run) or a second dispatch replaces the
# run still going for the same ref.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check (Linux)
    # Runs on tag pushes too: every build job `needs` it, so a tag can
    # never ship artifacts from a tree CI has not tested.
    # A fixed image, not ubuntu-latest: that label moves to Ubuntu 26 from
    # 2026-10-19, and the apt package names below are the 24.04 ones (the
    # same distribution as scripts/ctr.sh). Move deliberately.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: System dependencies (Tauri on Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libudev-dev
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch, 2026-10
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: .
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Secret hygiene
        run: scripts/check_secret_hygiene.sh
      - name: Format
        run: cargo fmt --check
      - name: Frontend install and build
        run: cd app && npm ci && npm run check && npm run build
      - name: Clippy
        run: |
          cargo clippy --workspace --all-targets -- -D warnings
          cargo clippy -p app --all-targets --features e2e -- -D warnings
      - name: Tests
        run: cargo test --workspace
      - name: Frontend tests
        run: cd app && npm test

  check-windows:
    name: Check (Windows)
    # Lints and tests the Windows code paths, so a Windows-only failure is
    # caught on the pull request that introduces it rather than on the
    # release tag. Runs on tag pushes too — it gates `build-windows`.
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch, 2026-10
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: .
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Frontend install and build
        run: cd app && npm ci && npm run build
      - name: Clippy
        run: |
          cargo clippy --workspace --all-targets -- -D warnings
          cargo clippy -p app --all-targets --features e2e -- -D warnings
      - name: Cargo test
        # --no-fail-fast: report every failing test binary in one run, not
        # only the first (Windows-only failures surface at release time).
        run: cargo test --workspace --no-fail-fast

  e2e:
    name: End-to-end
    # Runs on every trigger (tag push, workflow_dispatch); every build job
    # `needs` it.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: System dependencies (Tauri on Linux + E2E harness)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libudev-dev xvfb gnome-keyring libsecret-tools dbus-x11 at-spi2-core sqlite3
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch, 2026-10
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: .
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            app/package-lock.json
            e2e/package-lock.json
      - name: End-to-end tests
        run: scripts/e2e.sh

  version:
    name: Version
    # One job so the semver rules live in exactly one place; both build jobs
    # read `needs.version.outputs.version`. Seconds on a plain runner.
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
            if [ "$VERSION" = "${GITHUB_REF_NAME}" ]; then
              echo "release tag must start with v (got ${GITHUB_REF_NAME})" >&2
              exit 1
            fi
            if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
              echo "version '$VERSION' is not semver" >&2
              exit 1
            fi
          else
            # A dispatch build is a dry run. A version containing "dev" also
            # suppresses the app's own update check (app_update::is_dev_build).
            VERSION=0.0.0-dev
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building version: $VERSION"

  build-linux:
    name: AppImage
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: [version, check, check-windows, e2e]
    runs-on: ubuntu-24.04
    # Built inside Debian 13, so the AppImage bundles its WebKitGTK 2.54: the
    # first WebKitGTK that renders on the GPU with NVIDIA on Wayland, and
    # Debian 13 has the oldest glibc (2.41) that ships it. Before 2026-10-30
    # this job ran on Ubuntu 22.04 (WebKitGTK 2.50), which rendered
    # everything on the CPU there. The AppImage now needs glibc 2.41 or newer.
    container:
      image: docker.io/library/debian:13
    env:
      # No FUSE in a container: the bundler's linuxdeploy (an AppImage itself)
      # extracts itself and runs instead of mounting.
      APPIMAGE_EXTRACT_AND_RUN: "1"
    steps:
      # Before checkout: git for actions/checkout, curl for the Rust
      # toolchain, wget for appimagetool. Root in the container, so no sudo.
      - name: System dependencies (Tauri on Linux + appimagetool)
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates git curl wget xz-utils file \
            patchelf xdg-utils build-essential pkg-config libssl-dev \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libudev-dev zsync

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch, 2026-10
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: .
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install frontend dependencies
        working-directory: app
        run: npm ci

      # Tauri downloads its bundling tools from GitHub releases once, with no
      # retry, and a GitHub 504 fails the build (v0.9.11). Fetch the same files
      # into its tool folder with retries first; Tauri then finds them and skips
      # its own download. Names and URLs follow tauri-bundler for
      # @tauri-apps/cli 2.12.4 (linux/appimage/linuxdeploy.rs); a newer CLI that
      # wants other files simply downloads them itself. The AppImage runtime
      # (moving `continuous` tag, as before) is handed to linuxdeploy's plugin
      # and to appimagetool so neither downloads it again.
      - name: Pre-download Tauri's AppImage tools (with retries)
        run: |
          set -euo pipefail
          get() { curl -fsSL --retry 6 --retry-delay 10 --retry-all-errors -o "$1" "$2"; }
          tools="${XDG_CACHE_HOME:-$HOME/.cache}/tauri"
          mkdir -p "$tools" "$RUNNER_TEMP/appimage-runtime"
          rel=https://github.com/tauri-apps/binary-releases/releases/download
          get "$tools/AppRun-x86_64" "$rel/apprun-old/AppRun-x86_64"
          get "$tools/linuxdeploy-07333c6-x86_64.AppImage" "$rel/linuxdeploy-07333c6/linuxdeploy-x86_64.AppImage"
          chmod +x "$tools/AppRun-x86_64" "$tools/linuxdeploy-07333c6-x86_64.AppImage"
          runtime="$RUNNER_TEMP/appimage-runtime/runtime-x86_64"
          get "$runtime" https://github.com/AppImage/type2-runtime/releases/download/continuous/runtime-x86_64
          echo "LDAI_RUNTIME_FILE=$runtime" >> "$GITHUB_ENV"

      - name: Build the AppImage
        working-directory: app
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: npx tauri build --bundles appimage --config "{\"version\":\"$VERSION\"}"

      - name: Repack with update information
        working-directory: target/release/bundle/appimage
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          SRC="GRID Launcher_${VERSION}_amd64.AppImage"
          ls -l
          chmod +x "$SRC"
          # Tauri's bundler embeds no update information, so unpack its
          # AppDir and let appimagetool write the ELF section AppImageUpdate
          # reads. The listing below makes a missing AppRun/.desktop/icon
          # diagnosable straight from the log.
          "./$SRC" --appimage-extract > /dev/null
          ls -l squashfs-root
          # A tagged release, checksum-verified: this job holds the token that
          # uploads the release assets, so it runs no tool that a moving tag
          # (`continuous`) could swap out. The digest is the release asset's
          # published sha256.
          curl -fsSL --retry 6 --retry-delay 10 --retry-all-errors -o appimagetool \
            "https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage"
          echo "ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0  appimagetool" | sha256sum -c -
          chmod +x appimagetool
          mkdir -p "$GITHUB_WORKSPACE/dist"
          OUTPUT_NAME="grid-launcher-${VERSION}-x86_64.AppImage"
          UPDATE_INFO="gh-releases-zsync|Sixdd6|grid-launcher|latest|grid-launcher-*-x86_64.AppImage.zsync"
          ./appimagetool --appimage-extract-and-run --runtime-file "$LDAI_RUNTIME_FILE" -u "$UPDATE_INFO" \
            squashfs-root "$GITHUB_WORKSPACE/dist/$OUTPUT_NAME"
          # appimagetool may write the .zsync into the working directory;
          # the upload steps expect it in dist/ next to the AppImage.
          if [ -f "$OUTPUT_NAME.zsync" ]; then mv "$OUTPUT_NAME.zsync" "$GITHUB_WORKSPACE/dist/"; fi
          ls -l "$GITHUB_WORKSPACE/dist"

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: grid-launcher-linux-appimage
          if-no-files-found: error
          path: |
            dist/grid-launcher-*-x86_64.AppImage
            dist/grid-launcher-*-x86_64.AppImage.zsync

  build-linux-packages:
    name: Linux packages (.deb, .rpm)
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: [version, check, check-windows, e2e]
    # Ubuntu 24.04 (glibc 2.39): the packages use the system's WebKitGTK and
    # declare it as a dependency instead of bundling one, so each distribution
    # renders with its own (and gets its security updates). Fedora's 2.54.2
    # renders on the GPU with NVIDIA on Wayland; the AppImage's bundled 2.54.0
    # (Debian 13) blinks on fades there (2026-10-30).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: System dependencies (Tauri on Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libudev-dev

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch, 2026-10
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: .
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install frontend dependencies
        working-directory: app
        run: npm ci

      - name: Build the .deb and .rpm
        working-directory: app
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          # The installed binary is /usr/bin/grid-launcher. An RPM version
          # cannot hold "-", so a pre-release's separator becomes "+".
          RPM_VERSION="${VERSION//-/+}"
          npx tauri build --bundles deb --config "{\"version\":\"$VERSION\",\"mainBinaryName\":\"grid-launcher\"}"
          npx tauri build --bundles rpm --config "{\"version\":\"$RPM_VERSION\",\"mainBinaryName\":\"grid-launcher\"}"
          mkdir -p "$GITHUB_WORKSPACE/dist"
          cp "$GITHUB_WORKSPACE/target/release/bundle/deb/GRID Launcher_${VERSION}_amd64.deb" \
            "$GITHUB_WORKSPACE/dist/grid-launcher_${VERSION}_amd64.deb"
          cp "$GITHUB_WORKSPACE/target/release/bundle/rpm/GRID Launcher-${RPM_VERSION}-1.x86_64.rpm" \
            "$GITHUB_WORKSPACE/dist/grid-launcher-${RPM_VERSION}-1.x86_64.rpm"
          ls -l "$GITHUB_WORKSPACE/dist"

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: grid-launcher-linux-packages
          if-no-files-found: error
          path: |
            dist/grid-launcher_*_amd64.deb
            dist/grid-launcher-*.x86_64.rpm

  build-windows:
    name: Windows installer
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: [version, check, check-windows, e2e]
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch, 2026-10
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: .
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install frontend dependencies
        working-directory: app
        run: npm ci

      # Same reason as the AppImage job's pre-download (a GitHub 504 on
      # nsis-3.13.zip failed v0.9.11's installer). Layout and SHA-1s follow
      # tauri-bundler for @tauri-apps/cli 2.12.4 (windows/nsis/mod.rs): the zip
      # unpacked to <cache>/tauri/NSIS, plus nsis_tauri_utils.dll in its
      # plugins. A newer CLI that wants other versions sees the hash mismatch and
      # downloads them itself.
      - name: Pre-download Tauri's NSIS tools (with retries)
        run: |
          set -euo pipefail
          get() { curl -fsSL --retry 6 --retry-delay 10 --retry-all-errors -o "$1" "$2"; }
          tools="$(cygpath -u "$LOCALAPPDATA")/tauri"
          mkdir -p "$tools"
          get "$RUNNER_TEMP/nsis.zip" https://github.com/tauri-apps/binary-releases/releases/download/nsis-3.13/nsis-3.13.zip
          echo "db14f8af2ea346b786c6ae19343f61aaf5e09b8e  $RUNNER_TEMP/nsis.zip" | sha1sum -c -
          rm -rf "$tools/NSIS" "$tools/nsis-3.13"
          unzip -q "$RUNNER_TEMP/nsis.zip" -d "$tools"
          mv "$tools/nsis-3.13" "$tools/NSIS"
          dll="$tools/NSIS/Plugins/x86-unicode/additional/nsis_tauri_utils.dll"
          mkdir -p "$(dirname "$dll")"
          get "$dll" https://github.com/tauri-apps/nsis-tauri-utils/releases/download/nsis_tauri_utils-v0.5.3/nsis_tauri_utils.dll
          echo "75197fee3c6a814fe035788d1c34ead39349b860  $dll" | sha1sum -c -

      - name: Build the NSIS installer
        working-directory: app
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: npx tauri build --bundles nsis --config "{\"version\":\"$VERSION\"}"

      - name: Rename the installer
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist
          mv "target/release/bundle/nsis/GRID Launcher_${VERSION}_x64-setup.exe" \
             "dist/grid-launcher-${VERSION}-windows-x86_64-setup.exe"
          ls -l dist

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: grid-launcher-windows-setup
          if-no-files-found: error
          path: dist/grid-launcher-*-windows-x86_64-setup.exe

  attach:
    name: Attach to draft release
    # The only job that writes releases, and only after every build: the
    # draft gets all five files or none. It never publishes the release.
    if: github.event_name == 'push'
    needs: [version, build-linux, build-linux-packages, build-windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Attach to the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          files=(
            "dist/grid-launcher-${VERSION}-x86_64.AppImage"
            "dist/grid-launcher-${VERSION}-x86_64.AppImage.zsync"
            "dist/grid-launcher_${VERSION}_amd64.deb"
            "dist/grid-launcher-${VERSION//-/+}-1.x86_64.rpm"
            "dist/grid-launcher-${VERSION}-windows-x86_64-setup.exe"
          )
          ls -l dist
          for f in "${files[@]}"; do
            [ -f "$f" ] || { echo "missing build output: $f" >&2; exit 1; }
          done
          # gh finds a draft by its tag name. The usual flow drafts the notes
          # first; a draft is created here only when there is none yet.
          if draft=$(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null); then
            if [ "$draft" != true ]; then
              echo "::warning::$TAG is already published; its files are being replaced"
            fi
          else
            gh release create "$TAG" --draft --verify-tag --title "$TAG" \
              --notes "Release notes to come."
          fi
          gh release upload "$TAG" "${files[@]}" --clobber
          echo "::notice::Attached ${#files[@]} files to the $TAG release. Publish it when ready."
