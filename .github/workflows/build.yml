name: Build

# One pipeline for the Rust app. It runs only when a release is published
# or when started by hand (workflow_dispatch), never on a push or pull
# request: local checks gate day-to-day work. A release runs the gates and
# the end-to-end suite, then builds the artifacts. A workflow_dispatch run
# does everything as a dry run — it builds version 0.0.0-dev, uploads to
# the run, and attaches nothing.
#
# `types: [published]` only. It fires both for a release published directly
# and for a draft that is later published, which is the flow that writes the
# notes first; `created` misses the draft flow, and listing both would build
# a direct publish twice.
on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  check:
    name: Check (Linux)
    # Runs on release events too: both build jobs `needs` it, so a tag can
    # never ship artifacts from a tree CI has not tested.
    # A fixed image, not ubuntu-latest: that label moves to Ubuntu 26 from
    # 2026-10-19, and the apt package names below are the 24.04 ones (the
    # same distribution as scripts/ctr.sh). Move deliberately.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: System dependencies (Tauri on Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch, 2026-10
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: .
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Secret hygiene
        run: scripts/check_secret_hygiene.sh
      - name: Format
        run: cargo fmt --check
      - name: Frontend install and build
        run: cd app && npm ci && npx svelte-check && npm run build
      - name: Clippy
        run: |
          cargo clippy --workspace --all-targets -- -D warnings
          cargo clippy -p app --all-targets --features e2e -- -D warnings
      - name: Tests
        run: cargo test --workspace
      - name: Frontend tests
        run: cd app && npm test

  check-windows:
    name: Check (Windows)
    # Lints and tests the Windows code paths, so a Windows-only failure is
    # caught on the pull request that introduces it rather than on the
    # release tag. Runs on release events too — it gates `build-windows`.
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch, 2026-10
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: .
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Frontend install and build
        run: cd app && npm ci && npm run build
      - name: Clippy
        run: |
          cargo clippy --workspace --all-targets -- -D warnings
          cargo clippy -p app --all-targets --features e2e -- -D warnings
      - name: Cargo test
        run: cargo test --workspace

  e2e:
    name: End-to-end
    # Runs on every trigger (release, workflow_dispatch); both build jobs
    # `need` it.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: System dependencies (Tauri on Linux + E2E harness)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev xvfb gnome-keyring libsecret-tools dbus-x11 at-spi2-core sqlite3
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch, 2026-10
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: .
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            app/package-lock.json
            e2e/package-lock.json
      - name: End-to-end tests
        run: scripts/e2e.sh

  version:
    name: Version
    # One job so the semver rules live in exactly one place; both build jobs
    # read `needs.version.outputs.version`. Seconds on a plain runner.
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = "release" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
            if [ "$VERSION" = "${GITHUB_REF_NAME}" ]; then
              echo "release tag must start with v (got ${GITHUB_REF_NAME})" >&2
              exit 1
            fi
            if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
              echo "version '$VERSION' is not semver" >&2
              exit 1
            fi
          else
            # A dispatch build is a dry run. A version containing "dev" also
            # suppresses the app's own update check (app_update::is_dev_build).
            VERSION=0.0.0-dev
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building version: $VERSION"

  build-linux:
    name: AppImage
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    needs: [version, check, check-windows, e2e]
    runs-on: ubuntu-24.04
    # Built inside Debian 13, so the AppImage bundles its WebKitGTK 2.54: the
    # first WebKitGTK that renders on the GPU with NVIDIA on Wayland, and
    # Debian 13 has the oldest glibc (2.41) that ships it. Before 2026-10-30
    # this job ran on Ubuntu 22.04 (WebKitGTK 2.50), which rendered
    # everything on the CPU there. The AppImage now needs glibc 2.41 or newer.
    container:
      image: docker.io/library/debian:13
    env:
      # No FUSE in a container: the bundler's linuxdeploy (an AppImage itself)
      # extracts itself and runs instead of mounting.
      APPIMAGE_EXTRACT_AND_RUN: "1"
    permissions:
      contents: write
    steps:
      # Before checkout: git for actions/checkout, curl for the Rust
      # toolchain, wget for appimagetool. Root in the container, so no sudo.
      - name: System dependencies (Tauri on Linux + appimagetool)
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates git curl wget xz-utils file \
            patchelf xdg-utils build-essential pkg-config libssl-dev \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev zsync

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch, 2026-10
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: .
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install frontend dependencies
        working-directory: app
        run: npm ci

      - name: Build the AppImage
        working-directory: app
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: npx tauri build --bundles appimage --config "{\"version\":\"$VERSION\"}"

      - name: Repack with update information
        working-directory: target/release/bundle/appimage
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          SRC="GRID Launcher_${VERSION}_amd64.AppImage"
          ls -l
          chmod +x "$SRC"
          # Tauri's bundler embeds no update information, so unpack its
          # AppDir and let appimagetool write the ELF section AppImageUpdate
          # reads. The listing below makes a missing AppRun/.desktop/icon
          # diagnosable straight from the log.
          "./$SRC" --appimage-extract > /dev/null
          ls -l squashfs-root
          # A tagged release, checksum-verified: this job holds the token that
          # uploads the release assets, so it runs no tool that a moving tag
          # (`continuous`) could swap out. The digest is the release asset's
          # published sha256.
          wget -q -O appimagetool \
            "https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage"
          echo "ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0  appimagetool" | sha256sum -c -
          chmod +x appimagetool
          mkdir -p "$GITHUB_WORKSPACE/dist"
          OUTPUT_NAME="grid-launcher-${VERSION}-x86_64.AppImage"
          UPDATE_INFO="gh-releases-zsync|Sixdd6|grid-launcher|latest|grid-launcher-*-x86_64.AppImage.zsync"
          ./appimagetool --appimage-extract-and-run -u "$UPDATE_INFO" \
            squashfs-root "$GITHUB_WORKSPACE/dist/$OUTPUT_NAME"
          # appimagetool may write the .zsync into the working directory;
          # the upload steps expect it in dist/ next to the AppImage.
          if [ -f "$OUTPUT_NAME.zsync" ]; then mv "$OUTPUT_NAME.zsync" "$GITHUB_WORKSPACE/dist/"; fi
          ls -l "$GITHUB_WORKSPACE/dist"

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: grid-launcher-linux-appimage
          if-no-files-found: error
          path: |
            dist/grid-launcher-*-x86_64.AppImage
            dist/grid-launcher-*-x86_64.AppImage.zsync

      - name: Attach to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            dist/grid-launcher-*-x86_64.AppImage
            dist/grid-launcher-*-x86_64.AppImage.zsync

  build-linux-packages:
    name: Linux packages (.deb, .rpm)
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    needs: [version, check, check-windows, e2e]
    # Ubuntu 24.04 (glibc 2.39): the packages use the system's WebKitGTK and
    # declare it as a dependency instead of bundling one, so each distribution
    # renders with its own (and gets its security updates). Fedora's 2.54.2
    # renders on the GPU with NVIDIA on Wayland; the AppImage's bundled 2.54.0
    # (Debian 13) blinks on fades there (2026-10-30).
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: System dependencies (Tauri on Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch, 2026-10
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: .
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install frontend dependencies
        working-directory: app
        run: npm ci

      - name: Build the .deb and .rpm
        working-directory: app
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          # The installed binary is /usr/bin/grid-launcher. An RPM version
          # cannot hold "-", so a pre-release's separator becomes "+".
          RPM_VERSION="${VERSION//-/+}"
          npx tauri build --bundles deb --config "{\"version\":\"$VERSION\",\"mainBinaryName\":\"grid-launcher\"}"
          npx tauri build --bundles rpm --config "{\"version\":\"$RPM_VERSION\",\"mainBinaryName\":\"grid-launcher\"}"
          mkdir -p "$GITHUB_WORKSPACE/dist"
          cp "$GITHUB_WORKSPACE/target/release/bundle/deb/GRID Launcher_${VERSION}_amd64.deb" \
            "$GITHUB_WORKSPACE/dist/grid-launcher_${VERSION}_amd64.deb"
          cp "$GITHUB_WORKSPACE/target/release/bundle/rpm/GRID Launcher-${RPM_VERSION}-1.x86_64.rpm" \
            "$GITHUB_WORKSPACE/dist/grid-launcher-${RPM_VERSION}-1.x86_64.rpm"
          ls -l "$GITHUB_WORKSPACE/dist"

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: grid-launcher-linux-packages
          if-no-files-found: error
          path: |
            dist/grid-launcher_*_amd64.deb
            dist/grid-launcher-*.x86_64.rpm

      - name: Attach to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            dist/grid-launcher_*_amd64.deb
            dist/grid-launcher-*.x86_64.rpm

  build-windows:
    name: Windows installer
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    needs: [version, check, check-windows, e2e]
    runs-on: windows-latest
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch, 2026-10
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: .
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install frontend dependencies
        working-directory: app
        run: npm ci

      - name: Build the NSIS installer
        working-directory: app
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: npx tauri build --bundles nsis --config "{\"version\":\"$VERSION\"}"

      - name: Rename the installer
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist
          mv "target/release/bundle/nsis/GRID Launcher_${VERSION}_x64-setup.exe" \
             "dist/grid-launcher-${VERSION}-windows-x86_64-setup.exe"
          ls -l dist

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: grid-launcher-windows-setup
          if-no-files-found: error
          path: dist/grid-launcher-*-windows-x86_64-setup.exe

      - name: Attach to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: dist/grid-launcher-*-windows-x86_64-setup.exe
