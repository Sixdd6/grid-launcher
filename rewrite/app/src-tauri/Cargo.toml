[package]
name = "app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
license.workspace = true
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = ["protocol-asset"] }
tauri-plugin-log = "2"
grid-core = { path = "../../crates/grid-core" }
directories = "6.0.0"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
secrecy = "0.10.3"
gilrs = "0.11.0"
tokio = { version = "1.53.1", features = ["rt-multi-thread"] }
tauri-plugin-wdio = { version = "1.3.0", optional = true }
tauri-plugin-wdio-webdriver = { version = "1.3.0", optional = true }

[dev-dependencies]
tempfile = "3.27.0"

[features]
# Embeds the WebDriver automation server for E2E testing. Never enabled in
# release builds — see rewrite/scripts/check_secret_hygiene.sh, which fails
# if the plugins appear in the default (no-feature) dependency tree.
e2e = ["dep:tauri-plugin-wdio", "dep:tauri-plugin-wdio-webdriver", "grid-core/e2e"]
