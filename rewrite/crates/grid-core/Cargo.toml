[package]
name = "grid-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
base64 = "0.23.1"
bzip2 = "0.6.1"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
directories = "6.0.0"
flate2 = "1.1.10"
futures-util = "0.3.34"
keyring = "4.2.0"
liblzma = "0.4.8"
mime_guess = "2.0.5"
percent-encoding = "2.3.2"
regex = "1.11.3"
reqwest = { version = "0.13.4", default-features = false, features = ["rustls", "json", "query", "stream", "multipart"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
secrecy = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["preserve_order"] }
sevenz-rust2 = "0.22.2"
sha2 = "0.11.0"
tar = "0.4.46"
tempfile = "3.27.0"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "sync", "time"] }
toml = "1.1.4"
tracing = "0.1.44"
unrar = "0.5.8"
url = "2.5.8"
zip = "8.6.0"

[dev-dependencies]
futures = "0.3.34"
secrecy = "0.10.3"
serde_json = "1.0.151"
wiremock = "0.6.5"

[target."cfg(unix)".dependencies]
libc = "0.2.189"

[features]
# Gates the E2E forge-request redirect (GRID_LAUNCHER_E2E_FORGE_BASE) so a
# release build can never honor it — see launch/forge.rs.
e2e = []
