[package]
name = "grid-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
base64 = "0.23.1"
bzip2 = "0.6.1"
directories = "6.0.0"
flate2 = "1.1.10"
futures-util = "0.3.34"
keyring = "4.2.0"
liblzma = "0.4.8"
percent-encoding = "2.3.2"
reqwest = { version = "0.13.4", default-features = false, features = ["rustls", "json", "query", "stream"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
secrecy = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["preserve_order"] }
sevenz-rust2 = "0.22.2"
sha2 = "0.11.0"
tar = "0.4.46"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "sync", "time"] }
toml = "1.1.4"
url = "2.5.8"
zip = "8.6.0"

[dev-dependencies]
futures = "0.3.34"
secrecy = "0.10.3"
serde_json = "1.0.151"
tempfile = "3.27.0"
wiremock = "0.6.5"

[target."cfg(unix)".dependencies]
libc = "0.2.189"
