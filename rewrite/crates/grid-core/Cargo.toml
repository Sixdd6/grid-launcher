[package]
name = "grid-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
base64 = "0.23.1"
directories = "6.0.0"
keyring = "4.2.0"
reqwest = { version = "0.13.4", default-features = false, features = ["rustls", "json", "query"] }
secrecy = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros"] }
toml = "1.1.4"
url = "2.5.8"

[dev-dependencies]
secrecy = "0.10.3"
serde_json = "1.0.151"
tempfile = "3.27.0"
wiremock = "0.6.5"
